name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python syntax
        run: python3 -m py_compile build_bundles.py convert_monsters.py convert_spells.py

      - name: Verify build artifacts are current
        run: python3 build_bundles.py --check

  function onDataReady(){
    if (state.ui.mode === "track") setMode("track");
  }

  /* ---------------- wiring ---------------- */
  $("#m-browse").onclick = () => setMode("browse");
  $("#m-track").onclick = () => setMode("track");

  // picker: capture phase so the row's own click (pick) never fires for +
  $("#list").addEventListener("click", e => {
    const b = e.target.closest(".add");
    if (!b || !document.body.classList.contains("trk")) return;
    e.stopPropagation();
    addFromView(+b.closest(".item").dataset.i);
  }, true);
  // keyboard path: Enter on the listbox adds the active option
  $("#list").addEventListener("keydown", e => {
    if (e.key !== "Enter" || state.ui.mode !== "track") return;
    const id = $("#list").getAttribute("aria-activedescendant");
    const el = id && document.getElementById(id);
    if (el && el.dataset.i != null){ e.preventDefault(); addFromView(+el.dataset.i); }
  });

  // combatant list actions
  function flashErr(inp){
    inp.classList.add("err");
    setTimeout(() => inp.classList.remove("err"), 600);
    inp.focus();
  }
  const refocusAmt = id => {
    const el = $("#trklist").querySelector(`.cbt[data-id="${id}"] .cbt-amt`);
    if (el) el.focus();
  };
  $("#trklist").addEventListener("click", e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const card = btn.closest(".cbt"); if (!card) return;
    const id = card.dataset.id;
    if (btn.dataset.act === "x"){
      const c = byId(id);
      confirmSwap(btn, "Remove " + (c ? c.name : "") + "?", () => removeCombatant(id));
    } else if (btn.dataset.act === "init"){
      editInit(btn);
    } else {
      const amt = card.querySelector(".cbt-amt");
      if (applyHP(id, amt.value, btn.dataset.act)) refocusAmt(id);
      else flashErr(amt);
    }
  });
  $("#trklist").addEventListener("keydown", e => {
    if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
      const card = e.target.closest(".cbt");
      if (!card || state.enc.round < 1) return;
      e.preventDefault();
      const id = card.dataset.id;
      moveBy(id, e.key === "ArrowUp" ? -1 : 1);
      const el = $("#trklist").querySelector(`.cbt[data-id="${id}"]`);
      if (el) el.focus();
      return;
    }
    if (e.key !== "Enter") return;
    if (e.target.classList.contains("cbt-amt")){
      e.preventDefault();
      const id = e.target.closest(".cbt").dataset.id;
      const kind = e.shiftKey
        ? (state.enc.last.kind === "dmg" ? "heal" : "dmg") // Shift+Enter = opposite
        : state.enc.last.kind;                             // Enter = repeat last
      if (applyHP(id, e.target.value, kind)) refocusAmt(id);
      else flashErr(e.target);
    } else if (e.target.classList.contains("cbt") && state.enc.round >= 1){
      e.preventDefault();
      const b = e.target.querySelector(".cbt-init");
      if (b) editInit(b);
    }
  });

  // drag reorder (combat only; keyboard parity is Alt+Arrow above)
  let dragId = null;
  $("#trklist").addEventListener("dragstart", e => {
    const card = e.target.closest(".cbt");
    if (!card || state.enc.round < 1){ e.preventDefault(); return; }
    dragId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("drag");
  });
  $("#trklist").addEventListener("dragover", e => {
    if (dragId){ e.preventDefault(); e.dataTransfer.dropEffect = "move"; }
  });
  $("#trklist").addEventListener("drop", e => {
    if (!dragId) return;
    e.preventDefault();
    const over = e.target.closest(".cbt");
    reorderTo(dragId, over ? over.dataset.id : null);
    dragId = null;
  });
  $("#trklist").addEventListener("dragend", () => { dragId = null; renderTrk(); });

  $("#t-start").onclick = openStartModal;
  $("#t-next").onclick = nextTurn;
  $("#t-prev").onclick = prevTurn;
  $("#t-end").onclick = () =>
    confirmSwap($("#t-end"), "End combat?", endCombat);
  $("#t-reset").onclick = () =>
    confirmSwap($("#t-reset"), "Remove all monsters and NPCs?", resetEnc);
  $("#t-clear").onclick = () =>
    confirmSwap($("#t-clear"), "Remove everyone?", clearAll);
  $("#trkname").onclick = editName;
  $("#trkname").addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); editName(); }
  });
  $("#t-add").onclick = () => openAddForm();
  $("#t-undo").onclick = undo;
  $("#t-redo").onclick = redo;
  $("#qty").onchange = e => {
    state.ui.qty = Math.min(10, Math.max(1, int(e.target.value, 1)));
    save(LS.ui, state.ui);
  };

  return { state, setMode, onDataReady, renderTrk, key,
           mutate, undo, redo, addMany, addFromView, removeCombatant, applyHP,
           startCombat, endCombat, nextTurn, prevTurn, canPrev,
           setInitiative, reorderTo, moveBy, resetEnc, clearAll,
           initModOf, acOf, hpOf, openAddForm, openStartModal, closeOvl,
           _test: { vEnc, vParty, vPresets, vDice, vUi, autoName, hpClass, midInit } };
})();
/* const bindings don't become window properties; the start()/keydown hooks in
   the first script test window.TRK so they stay no-ops if this block is absent */
window.TRK = TRK;
</script>
</body>
</html>

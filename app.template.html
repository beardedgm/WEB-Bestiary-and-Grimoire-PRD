<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bestiary &amp; Grimoire</title>
<style>
:root{
  /* chrome — cool stone: the table the books lie on */
  --stone:#E7E5E0; --stone-2:#DCD9D2; --stone-3:#F2F1ED;
  --hair:#C5C2B8; --hair-soft:#D8D5CC;
  /* --faint carries real information (list metadata, ability labels, the empty
     state), so it clears 4.5:1 on every ground it sits on, --stone-2 included */
  --ink:#24211C; --dim:#5F594F; --faint:#645D51;

  /* the two paper stocks */
  --vellum:#FBF6EA; --vellum-edge:#E7DBBE; --vellum-cell:#F2E9D5;
  --paper:#FFFFFF;  --paper-edge:#DCD9D1;  --paper-cell:#F4F3F0;

  /* system inks, lifted from the printed blocks */
  --brick:#7B2418; --olive:#54632A; --gilt:#9C7C1C; --danger:#9C3020;

  --radius:3px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--stone); color:var(--ink);
  font:15px/1.55 var(--sans);
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--gilt); outline-offset:2px}
::selection{background:#EADFBC; color:var(--ink)}
#side,#list,#pane{scrollbar-color:var(--hair) transparent; scrollbar-width:thin}

/* ---- header ---- */
header{
  display:flex; align-items:center; gap:14px; padding:11px 16px;
  border-bottom:1px solid var(--hair); background:var(--stone-3); flex:none;
}
header h1{
  margin:0; white-space:nowrap; color:var(--ink);
  font:600 18px/1 var(--serif); font-variant:small-caps; letter-spacing:.07em;
}
header h1 .amp{color:var(--gilt); font-variant:normal; font-style:italic; padding:0 1px}
#q{
  flex:1; min-width:120px; padding:9px 13px; border-radius:var(--radius);
  border:1px solid var(--hair); background:var(--paper); color:var(--ink);
  font:15px/1.2 var(--sans);
}
#q::placeholder{color:var(--faint)}
#q:focus{outline:none; border-color:var(--gilt); box-shadow:0 0 0 3px rgba(156,124,28,.18)}
#count{
  color:var(--dim); white-space:nowrap; flex:none;
  font:11.5px/1 var(--mono); letter-spacing:.03em; font-variant-numeric:tabular-nums;
}
main{flex:1; display:flex; min-height:0}

/* ---- sidebar ---- */
#side{
  width:340px; flex:none; border-right:1px solid var(--hair);
  display:flex; flex-direction:column; background:var(--stone); min-height:0;
}
#filters{padding:11px 12px; border-bottom:1px solid var(--hair); background:var(--stone-3)}
/* native disclosure: keyboard and ARIA come free, and it still works with no JS */
#filters > summary{
  display:flex; align-items:center; gap:7px; min-height:24px; cursor:pointer;
  list-style:none; color:var(--dim);
  font:600 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.1em;
}
#filters > summary::-webkit-details-marker{display:none}
#filters > summary::before{
  content:"▸"; color:var(--faint); font-size:11px; line-height:1;
  transition:transform .12s ease-out;
}
#filters[open] > summary::before{transform:rotate(90deg)}
#filters[open] > summary{margin-bottom:9px}
#fcount{
  padding:2px 6px; border-radius:2px; letter-spacing:.06em;
  background:var(--gilt); color:#FBF6EA;
}
.frow{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px}
.frow:last-child{margin-bottom:0}
/* filters are traits — so they are set as trait tags */
.chip{
  font:600 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em;
  padding:6px 9px; border:1px solid var(--hair); border-radius:2px;  /* 24px tall: WCAG 2.5.8 */
  background:var(--stone); color:var(--dim); cursor:pointer;
  user-select:none; white-space:nowrap;
}
.chip:hover{border-color:var(--gilt); color:var(--ink)}
.chip.on{background:var(--gilt); border-color:var(--gilt); color:#FBF6EA}
.chip.on.dnd{background:var(--brick); border-color:var(--brick); color:#FBF6EA}
.chip.on.pf{background:var(--olive); border-color:var(--olive); color:#FBF6EA}
label.tog{
  display:flex; align-items:center; gap:6px; cursor:pointer;
  color:var(--dim); font-size:12px;
  min-height:24px;                 /* the label is the target, not the 13px box */
}
label.tog input{accent-color:var(--gilt); width:15px; height:15px}

/* range controls — same micro-type as the filter chips, no new colours */
#f-range:empty{display:none}
.rng{margin-bottom:9px}
.rng[hidden]{display:none}
.rng .lbl{display:block; margin-bottom:4px; color:var(--faint);
          font:600 9.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.1em}
.rng .row{display:flex; align-items:center; gap:6px}
.rng select{
  flex:1; min-width:0; padding:4px 6px; border-radius:2px;
  border:1px solid var(--hair); background:var(--stone); color:var(--ink);
  font:11.5px/1.3 var(--mono);
}
.rng select:focus{outline:none; border-color:var(--gilt);
                  box-shadow:0 0 0 2px rgba(156,124,28,.18)}
.rng .to{flex:none; color:var(--faint); font:10px/1 var(--mono)}

/* ---- list: system marked by a spine, like books on a shelf ---- */
#list{flex:1; overflow-y:auto; min-height:0}
#more{
  flex:none; padding:8px 12px; border-top:1px solid var(--hair-soft);
  background:var(--stone-3); color:var(--faint); font-size:12.5px;
}
.item{
  padding:8px 12px 8px 10px; border-bottom:1px solid var(--hair-soft);
  border-left:3px solid transparent; cursor:pointer;
  display:flex; align-items:baseline; gap:10px;
}
.item.dnd5e{border-left-color:var(--brick)}
.item.pf2e{border-left-color:var(--olive)}
.item:hover{background:var(--stone-2)}
.item.sel.dnd5e{background:var(--vellum)}   /* the row previews its own stock */
.item.sel.pf2e{background:var(--paper)}
.item.sel .nm{font-weight:600}
.item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .lv{
  flex:none; white-space:nowrap; color:var(--faint);
  font:10.5px/1 var(--mono); letter-spacing:.02em;
}

/* ---- reading pane: a sheet on the table ---- */
#pane{
  flex:1; overflow-y:auto; min-height:0; padding:26px 28px 60px;
  background:var(--stone-2);
  /* stock defaults; overridden per game system */
  --sysink:var(--brick); --sheet:var(--paper); --sheet-edge:var(--paper-edge);
  --cell:var(--paper-cell); --readfont:var(--sans); --readsize:14.5px;
}
#pane.dnd5e{
  --sysink:var(--brick); --sheet:var(--vellum); --sheet-edge:var(--vellum-edge);
  --cell:var(--vellum-cell); --readfont:var(--serif); --readsize:15.5px;
}
#pane.pf2e{
  --sysink:var(--olive); --sheet:var(--paper); --sheet-edge:var(--paper-edge);
  --cell:var(--paper-cell); --readfont:var(--sans); --readsize:14.5px;
}
#pane.empty{
  display:flex; align-items:center; justify-content:center;
  color:var(--faint); font:italic 16px/1 var(--serif);
}

/* ---- stat block ---- */
.sb{
  max-width:760px; margin:0 auto; padding:30px 34px 26px;
  background:var(--sheet); border:1px solid var(--sheet-edge); border-radius:2px;
  font-family:var(--readfont); font-size:var(--readsize); line-height:1.62;
  box-shadow:0 1px 2px rgba(36,33,28,.07), 0 10px 26px -14px rgba(36,33,28,.24);
  animation:lay .14s ease-out;
}
@keyframes lay{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.sb h2{
  margin:0; display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  font:600 30px/1.1 var(--serif); font-variant:small-caps; letter-spacing:.015em;
  color:var(--sysink);
}
.sb h2 .rank{
  flex:none; font:600 10.5px/1 var(--mono); font-variant:normal;
  text-transform:uppercase; letter-spacing:.11em;
  color:var(--sheet); background:var(--sysink); padding:6px 9px; border-radius:2px;
}
/* the 5e block's tapered rule vs Pathfinder's flat hairline */
.rule{margin:10px 0 14px; height:2px}
#pane.dnd5e .rule{background:linear-gradient(90deg,var(--sysink) 0%,var(--sysink) 58%,transparent 100%)}
#pane.pf2e .rule{height:1px; background:var(--hair)}

.traits{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 14px}
.trait{
  font:600 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em;
  padding:4px 7px; border:1px solid var(--gilt); border-radius:2px;
  background:var(--sysink); color:var(--sheet);
}
.trait.rarity{background:var(--gilt); border-color:var(--gilt); color:#241E0C}

/* fixed label column: values line up down the block, and a long value hangs
   in its own column instead of wrapping back under the label */
.kv{display:grid; grid-template-columns:6.6em 1fr; gap:0 10px;  /* 6.6em fits "Saving Throw" */
    align-items:baseline; margin:4px 0}
.kv b{font-weight:700; color:var(--ink)}
.kv span{color:var(--dim); font-variant-numeric:tabular-nums}

/* Saves are the number a GM hunts for mid-turn, so they get lifted out of the
   defense block as chips instead of running text. The tint is the same one the
   ability cells use, so this borrows existing vocabulary rather than adding a
   colour. */
.chips{display:inline-flex; flex-wrap:wrap; gap:5px; align-items:baseline}
.chips .statchip{
  display:inline-flex; align-items:baseline; gap:5px;
  padding:2px 7px; border-radius:2px;
  background:var(--cell); border:1px solid var(--sheet-edge);
  color:var(--ink); font:700 .82em var(--mono);
  font-variant-numeric:tabular-nums;
}
.chips .statchip b{text-transform:uppercase; letter-spacing:.07em; color:var(--sysink)}
.chips .qual{color:var(--dim); font-size:.85em}   /* formula, note — detail, not the number */

.sec{margin:24px 0 9px; padding-bottom:5px; color:var(--sysink)}
#pane.dnd5e .sec{
  font:600 17px/1 var(--serif); font-variant:small-caps; letter-spacing:.05em;
  text-transform:capitalize;
  background:linear-gradient(90deg,var(--sysink) 0%,var(--sysink) 70%,transparent 100%)
             left bottom/100% 2px no-repeat;
}
#pane.pf2e .sec{
  font:600 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.14em;
  border-bottom:1px solid var(--hair-soft);
}

.body p{margin:10px 0; color:var(--ink)}
.deg{margin:6px 0 6px 1px; padding-left:12px; border-left:2px solid var(--sheet-edge)}
.deg b{color:var(--sysink); font-weight:700}
.ht{margin:8px 0; padding-left:12px; border-left:2px solid var(--gilt)}
.ht b{font:700 11.5px/1.5 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--gilt)}
.ent{margin:13px 0}
/* Pathfinder prints strike names lowercase ("jaws"); they read as headings here.
   Italic on the 5e stock hurt legibility at body size, so both stocks set these
   upright. */
.ent .en{font-weight:700; color:var(--ink); text-transform:capitalize}
.act{font-family:var(--mono); font-size:.9em; color:var(--sysink);
     font-variant-numeric:tabular-nums}
.act.sym{font-size:1.05em; color:var(--ink); letter-spacing:.06em}  /* ◆◇ read as marks, not text */
.qual{color:var(--dim); font-size:.85em}

.grid6{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:14px 0}
.ab{
  background:var(--cell); border:1px solid var(--sheet-edge); border-radius:2px;
  padding:7px 2px; text-align:center;
}
.ab .k{font:600 9.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.09em; color:var(--faint)}
.ab .v{font:700 17px/1.35 var(--mono); color:var(--ink); font-variant-numeric:tabular-nums}
.ab .s{font:10px/1 var(--mono); color:var(--dim)}

.meta{
  margin-top:24px; padding-top:11px; border-top:1px solid var(--sheet-edge);
  font:11px/1.7 var(--mono); color:var(--faint);
}
.warn{
  margin-top:11px; padding:9px 11px; border-radius:2px;
  border:1px solid var(--danger);
  background:rgba(156,48,32,.055); color:var(--danger); font-size:12px;
}

/* ---- loader ---- */
#load{
  position:fixed; inset:0; z-index:50; padding:24px; background:var(--stone);
  display:flex; align-items:center; justify-content:center;
}
#load .card{max-width:560px; text-align:center}
#load h2{
  margin:0 0 12px; color:var(--brick);
  font:600 26px/1.2 var(--serif); font-variant:small-caps; letter-spacing:.05em;
}
#load p{color:var(--dim); margin:8px 0}
#drop{
  margin-top:16px; padding:26px; border:2px dashed var(--hair);
  border-radius:var(--radius); color:var(--dim); cursor:pointer; background:var(--stone-3);
}
#drop.hot{border-color:var(--gilt); color:var(--ink); background:var(--vellum)}
#load .st{
  margin-top:14px; text-align:left; white-space:pre;
  font:12px/1.7 var(--mono); color:var(--faint);
}
code{font:.92em var(--mono); color:var(--dim)}
kbd{
  font:11px/1 var(--mono); border:1px solid var(--hair); border-radius:3px;
  padding:2px 5px; background:var(--stone-3); color:var(--dim);
}

/* ---- quality floor ---- */
@media (max-width:760px){
  body{overflow:auto}
  header{flex-wrap:wrap}
  header h1{width:100%}
  main{flex-direction:column}
  #side{width:100%; border-right:none; border-bottom:1px solid var(--hair); max-height:46vh; overflow-y:auto}
  #list{min-height:150px}          /* a floor so the results list can't be squeezed to 0 */
  #pane{padding:16px 12px 40px}
  .sb{padding:22px 18px 20px}
  .sb h2{font-size:25px; flex-wrap:wrap; gap:8px}
  .grid6{grid-template-columns:repeat(3,1fr)}
  .kv{display:block}                       /* no room for a label column */
  .kv b{margin-right:7px}
}
@media (prefers-reduced-motion:reduce){
  .sb{animation:none}
  *{transition:none !important}
}

/* ==== initiative tracker ==================================================
   Every rule is gated on body.trk (or a #trk descendant), so browse mode is
   pixel-identical when the class is absent. */
.vh{position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
#mode{display:flex; gap:5px; flex:none}

#trk{display:none}
body.trk #trk{
  display:flex; flex-direction:column; min-height:0;
  width:380px; flex:none;
  border-right:1px solid var(--hair); background:var(--stone);
}
#trkhead{
  display:flex; align-items:baseline; gap:10px; padding:11px 12px;
  border-bottom:1px solid var(--hair); background:var(--stone-3);
}
#trkname{
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:600 15px/1.2 var(--serif); font-variant:small-caps; letter-spacing:.04em;
  color:var(--ink);
}
#trkround{
  flex:none; font:600 10.5px/1 var(--mono); text-transform:uppercase;
  letter-spacing:.09em; color:var(--dim);
}
#trklist{flex:1; overflow-y:auto; min-height:0;
         scrollbar-color:var(--hair) transparent; scrollbar-width:thin}
#trkempty{
  display:none; flex:1; padding:26px 14px; text-align:center;
  color:var(--faint); font:italic 14px/1.5 var(--serif);
}
#trklist:empty{flex:none}
#trklist:empty + #trkempty{display:block}
/* load-bearing: an author display rule on these would defeat the hidden attribute */
#trkbar[hidden], #dice[hidden], #trkovl[hidden], #pdisp[hidden]{display:none}

/* toolbar */
#trkbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:5px;
  padding:9px 12px; border-bottom:1px solid var(--hair); background:var(--stone-3);
}
#trkbar .sp{flex:1}
#qtywrap{display:flex; align-items:center; gap:4px; min-height:24px;
         color:var(--dim); font:600 10px/1 var(--mono)}
#qty{
  padding:4px 6px; border-radius:2px; border:1px solid var(--hair);
  background:var(--stone); color:var(--ink); font:11.5px/1.3 var(--mono);
}
#qty:focus{outline:none; border-color:var(--gilt); box-shadow:0 0 0 2px rgba(156,124,28,.18)}

/* add-to-encounter button on result rows (tracker mode only) */
.item .add{
  flex:none; width:24px; height:24px; margin:-4px -6px -4px 0;
  border:1px solid var(--hair); border-radius:2px; background:var(--stone-3);
  color:var(--dim); font:700 14px/1 var(--mono); cursor:pointer;
}
.item .add:hover{border-color:var(--gilt); color:var(--ink)}
body:not(.trk) .item .add{display:none}

/* combatant cards — the spine metaphor from the results list */
.cbt{
  padding:8px 12px 9px 9px; border-bottom:1px solid var(--hair-soft);
  border-left:3px solid var(--hair);
}
.cbt.dnd5e{border-left-color:var(--brick)}
.cbt.pf2e{border-left-color:var(--olive)}
.cbt.pc{border-left-color:var(--gilt)}
.cbt-r1{display:flex; align-items:baseline; gap:8px}
.cbt-init{
  flex:none; min-width:26px; text-align:right; color:var(--ink);
  font:700 15px/1.2 var(--mono); font-variant-numeric:tabular-nums;
}
.cbt-nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
        white-space:nowrap; font-weight:600; color:var(--ink)}
.cbt-ac{flex:none; font:600 10.5px/1 var(--mono); color:var(--dim);
        font-variant-numeric:tabular-nums}
.cbt-x{
  flex:none; width:24px; height:24px; border:none; background:none; border-radius:2px;
  color:var(--faint); font:14px/1 var(--mono); cursor:pointer; align-self:center;
}
.cbt-x:hover{color:var(--danger); background:var(--stone-2)}
.cbt-r2{display:flex; align-items:center; gap:7px; margin:6px 0 0 34px}
.hpbar{flex:1; height:4px; border-radius:2px; background:var(--stone-2);
       border:1px solid var(--hair-soft); overflow:hidden}
.hpbar i{display:block; height:100%}
.hp-hi{background:var(--olive)} .hp-mid{background:var(--gilt)} .hp-lo{background:var(--brick)}
.cbt-hp{flex:none; min-width:44px; font:11px/1 var(--mono); color:var(--dim);
        font-variant-numeric:tabular-nums}
.cbt-amt{
  width:46px; padding:3px 4px; border-radius:2px; border:1px solid var(--hair);
  background:var(--paper); color:var(--ink); font:12px/1.2 var(--mono); text-align:right;
}
.cbt-amt:focus{outline:none; border-color:var(--gilt); box-shadow:0 0 0 2px rgba(156,124,28,.18)}
.cbt-amt.err{border-color:var(--danger); box-shadow:0 0 0 2px rgba(156,48,32,.15)}
.cbt .dmg,.cbt .heal{
  width:24px; height:24px; border-radius:2px; border:1px solid var(--hair);
  background:var(--stone-3); color:var(--ink); font:700 13px/1 var(--mono); cursor:pointer;
}
.cbt .dmg:hover{border-color:var(--danger); color:var(--danger)}
.cbt .heal:hover{border-color:var(--olive); color:var(--olive)}
.cbt.ko{opacity:.75}
.cbt.ko .cbt-nm{color:var(--dim)}
.kochip{
  flex:none; padding:2px 5px; border:1px solid var(--hair); border-radius:2px;
  color:var(--faint); font:600 9px/1 var(--mono); text-transform:uppercase; letter-spacing:.07em;
}

/* combat state */
#trkbar .go{background:var(--gilt); border-color:var(--gilt); color:#FBF6EA}
#trkbar .chip:disabled{opacity:.45; cursor:default; pointer-events:none}
#trkname{cursor:pointer}
#trkname:hover{text-decoration:underline; text-decoration-color:var(--gilt)}
.trkname-edit{
  flex:1; min-width:0; padding:2px 5px; border-radius:2px; border:1px solid var(--gilt);
  background:var(--paper); color:var(--ink); font:600 13px/1.2 var(--sans);
}
.cbt.on{background:var(--stone-3)}
.cbt.on .cbt-init{color:var(--gilt)}
.cbt.drag{opacity:.5}
button.cbt-init{border:none; background:none; padding:0; cursor:pointer}
button.cbt-init:hover{text-decoration:underline; text-decoration-color:var(--gilt)}
.cbt-init-edit{
  flex:none; width:44px; padding:2px 3px; border-radius:2px; border:1px solid var(--gilt);
  background:var(--paper); color:var(--ink); text-align:right;
  font:700 13px/1.2 var(--mono);
}

/* start-combat rows */
.srows{max-height:50vh; overflow-y:auto; margin:4px 0}
.srow{display:flex; align-items:center; gap:8px; padding:6px 0;
      border-bottom:1px solid var(--hair-soft)}
.srow:last-child{border-bottom:none}
.srnm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      font-weight:600; color:var(--ink); font-size:13px}
.sbreak{flex:none; font:10.5px/1 var(--mono); color:var(--faint)}
.stot{flex:none; min-width:24px; text-align:right;
      font:700 14px/1 var(--mono); font-variant-numeric:tabular-nums; color:var(--ink)}
.sinit{
  flex:none; width:64px; padding:4px 6px; border-radius:2px; border:1px solid var(--hair);
  background:var(--stone-3); color:var(--ink); font:13px/1.2 var(--mono); text-align:right;
}
.sinit:focus{outline:none; border-color:var(--gilt); box-shadow:0 0 0 2px rgba(156,124,28,.18)}
.sinit[aria-invalid="true"]{border-color:var(--danger)}
.sre{min-width:24px}

/* inline confirm — replaces the triggering control, never window.confirm */
.cfm{display:inline-flex; align-items:center; gap:5px; font:11px/1.2 var(--sans); color:var(--dim)}
.cfm .chip.yes{border-color:var(--danger); color:var(--danger)}
.cfm .chip.yes:hover{background:var(--danger); color:var(--paper)}

/* overlay + dialog — a sheet laid on the table */
#trkovl{
  position:fixed; inset:0; z-index:40; background:rgba(36,33,28,.35);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.dlg{
  width:min(360px, 100%); max-height:85vh; overflow-y:auto;
  background:var(--paper); border:1px solid var(--paper-edge); border-radius:2px;
  padding:20px 22px;
  box-shadow:0 1px 2px rgba(36,33,28,.07), 0 14px 30px -12px rgba(36,33,28,.3);
}
.dlg h3{margin:0 0 12px; color:var(--ink);
        font:600 18px/1.2 var(--serif); font-variant:small-caps; letter-spacing:.03em}
.dlg label{display:block; margin:9px 0; color:var(--dim); font-size:12px}
.dlg label input,.dlg label select{
  display:block; width:100%; margin-top:3px; padding:7px 9px; border-radius:2px;
  border:1px solid var(--hair); background:var(--stone-3); color:var(--ink);
  font:13.5px/1.3 var(--sans);
}
.dlg label input:focus,.dlg label select:focus{
  outline:none; border-color:var(--gilt); box-shadow:0 0 0 2px rgba(156,124,28,.18)}
.dlg .row2{display:flex; gap:10px}
.dlg .row2 label{flex:1}
.dlg .btns{display:flex; gap:6px; justify-content:flex-end; margin-top:14px}
.dlg .warn{margin:0 0 10px}
.dlg .chip.yes{background:var(--gilt); border-color:var(--gilt); color:#FBF6EA}

@media (max-width:760px){
  body.trk #trk{width:100%; order:-1; border-right:none; border-bottom:1px solid var(--hair)}
  body.trk #trklist{max-height:60vh}
}
</style>
</head>
<body>

<div id="load"><div class="card">
  <h2>Bestiary &amp; Grimoire</h2>
  <p id="lmsg">Loading data files…</p>
  <div id="drop" hidden>
    <b>Drop the four JSON files here</b><br>
    <span style="font-size:12px">monsters-5e · monsters-pf2e · spells-5e · spells-pf2e<br>
    (or click to browse)</span>
    <input id="fin" type="file" multiple accept=".json" hidden>
  </div>
  <div class="st" id="lst"></div>
</div></div>

<header>
  <h1>Bestiary <span class="amp">&amp;</span> Grimoire</h1>
  <input id="q" type="search" aria-label="Search creatures and spells by name"
         placeholder="Search by name…  ( / to focus )" autocomplete="off">
  <span id="count" role="status" aria-live="polite" aria-atomic="true"></span>
  <span id="mode" role="group" aria-label="App mode">
    <button type="button" id="m-browse" class="chip on" aria-pressed="true">Library</button>
    <button type="button" id="m-track" class="chip" aria-pressed="false">Tracker</button>
  </span>
</header>

<main>
  <div id="side">
    <details id="filters" open>
      <summary>Filters<span id="fcount" hidden></span></summary>
      <div class="frow" id="f-kind"></div>
      <div class="frow" id="f-sys"></div>
      <div class="frow" id="f-extra"></div>
      <div id="f-range"></div>
      <div class="frow">
        <label class="tog"><input type="checkbox" id="deep"> also search description text</label>
      </div>
    </details>
    <div id="list" role="listbox" aria-label="Search results" tabindex="0"></div>
    <div id="more" hidden></div>
  </div>
  <section id="trk" aria-label="Initiative tracker">
    <div id="trkhead">
      <span id="trkname" role="button" tabindex="0"
            aria-label="Encounter name — press Enter to rename" title="Rename">Encounter</span>
      <span id="trkround">Setup</span>
    </div>
    <div id="trkbar">
      <button type="button" class="chip go" id="t-start" disabled>Start combat</button>
      <button type="button" class="chip" id="t-prev" hidden aria-label="Previous turn">◀</button>
      <button type="button" class="chip go" id="t-next" hidden>Next ▶</button>
      <button type="button" class="chip" id="t-end" hidden>End</button>
      <button type="button" class="chip" id="t-add">Add</button>
      <span id="qtywrap"><label for="qty" aria-hidden="true">×</label><select id="qty" aria-label="How many to add">
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      </select></span>
      <span class="sp"></span>
      <button type="button" class="chip" id="t-undo" disabled>Undo</button>
      <button type="button" class="chip" id="t-redo" disabled>Redo</button>
      <button type="button" class="chip" id="t-reset">Reset</button>
      <button type="button" class="chip" id="t-clear">Clear</button>
    </div>
    <div id="trklist" role="list" aria-label="Combatants"></div>
    <div id="trkempty">No combatants yet — add monsters from the results list, or your party from the toolbar.</div>
    <span id="trklive" class="vh" role="status" aria-live="polite"></span>
    <details id="dice" hidden></details>
  </section>
  <div id="pane" class="empty">Select an entry</div>
  <div id="trkovl" hidden></div>
  <div id="pdisp" hidden></div>
</main>

<script>
"use strict";
const FILES = ["spells-5e.json","spells-pf2e.json","monsters-5e.json","monsters-pf2e.json"];
let DATA = [], view = [], sel = -1;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- loading ---------------- */
function ingest(name, arr){
  const kind = arr.length && arr[0].schema && arr[0].schema.startsWith("ttrpg-spell") ? "spell" : "monster";
  for (const r of arr){
    r._kind = kind;
    r._search = r.name.toLowerCase();
    r._deep = null;                       // built lazily on first deep search
    DATA.push(r);
  }
  return kind;
}
function logline(t){ $("#lst").textContent += t + "\n"; }

async function tryFetch(){
  let ok = 0;
  for (const f of FILES){
    try{
      const res = await fetch(f, {cache:"no-store"});
      if (!res.ok) throw new Error("HTTP " + res.status);
      const arr = await res.json();
      ingest(f, arr); ok++;
      logline("✓ " + f + "  (" + arr.length.toLocaleString() + " records)");
    }catch(e){ logline("✗ " + f + "  — " + e.message); }
  }
  return ok;
}

function handleFiles(files){
  let pending = 0, done = 0;
  for (const file of files){
    if (!file.name.endsWith(".json")) continue;
    pending++;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const arr = JSON.parse(fr.result);
        if (!Array.isArray(arr)) throw new Error("not a JSON array");
        ingest(file.name, arr);
        logline("✓ " + file.name + "  (" + arr.length.toLocaleString() + " records)");
      }catch(e){ logline("✗ " + file.name + " — " + e.message); }
      if (++done === pending) start();
    };
    fr.readAsText(file);
  }
  if (!pending) logline("no .json files in that drop");
}

async function boot(){
  const n = await tryFetch();
  if (n) { start(); return; }
  $("#lmsg").innerHTML = "Couldn't read the files automatically.<br>" +
    "<span style='font-size:13px'>Browsers block local file access from <code>file://</code> pages. " +
    "Drop the files below, or serve the folder with <code>python -m http.server</code> and reload.</span>";
  $("#drop").hidden = false;
}
$("#drop").onclick = () => $("#fin").click();
$("#fin").onchange = e => handleFiles(e.target.files);
["dragenter","dragover"].forEach(ev => $("#drop").addEventListener(ev, e => {
  e.preventDefault(); $("#drop").classList.add("hot"); }));
["dragleave","drop"].forEach(ev => $("#drop").addEventListener(ev, e => {
  e.preventDefault(); $("#drop").classList.remove("hot"); }));
$("#drop").addEventListener("drop", e => handleFiles(e.dataTransfer.files));

function start(){
  if (!DATA.length){ logline("\nNothing loaded."); return; }
  DATA.sort((a,b) => a.name.localeCompare(b.name));
  buildFilters();
  // the narrow layout caps the sidebar height, where the panel and the results
  // compete for the same budget — start collapsed there, expanded on desktop
  if (matchMedia("(max-width:760px)").matches) $("#filters").open = false;
  $("#load").remove();
  refresh();
  $("#q").focus();
  if (window.TRK) TRK.onDataReady();
}

/* ---------------- filters ---------------- */
const F = { kind:new Set(), sys:new Set(), extra:new Set(), range:{} };

/* The corpus carries four separate numeric scales. CR 15 is not Creature 15,
   so each scale filters only its own records and they never interact.
   Pathfinder focus spells share the rank scale: they are numbered 1-10 exactly
   as ranks are, and the FOCUS chip already isolates them as a category. */
const SCALES = [
  { key:"cr5e",   label:"D&D 5e · CR",
    applies: r => r._kind === "monster" && r.gameSystem === "dnd5e",
    valueOf: r => r.challenge?.value,
    labelOf: r => r.challenge.display },
  { key:"lvlPf",  label:"Pathfinder 2e · Creature level",
    applies: r => r._kind === "monster" && r.gameSystem === "pf2e",
    valueOf: r => r.challenge?.value,
    labelOf: r => String(r.challenge.value) },
  { key:"spl5e",  label:"D&D 5e · Spell level",
    applies: r => r._kind === "spell" && r.gameSystem === "dnd5e",
    valueOf: r => r.level?.value,
    labelOf: r => String(r.level.value) },
  { key:"rankPf", label:"Pathfinder 2e · Rank",
    applies: r => r._kind === "spell" && r.gameSystem === "pf2e",
    valueOf: r => r.level?.value,
    labelOf: r => String(r.level.value) },
];

// scaleFor is first-match-wins: it returns the first SCALES entry whose
// applies() matches, not every entry that matches. buildRangeControls() and
// updateRangeVisibility() test s.applies(r) directly for each entry, so they
// silently assume the same "exactly one entry matches" invariant scaleFor
// relies on. Keep SCALES entries mutually exclusive (today's four predicates
// partition the corpus perfectly). If a new scale is ever added that overlaps
// an existing one (e.g. carving Pathfinder focus spells out of rankPf),
// insert it BEFORE the broader entry it overlaps, so scaleFor keeps agreeing
// with the other two call sites about which single scale governs a record.
function scaleFor(r){
  for (const s of SCALES) if (s.applies(r)) return s;
  return null;
}

function passRange(r){
  const s = scaleFor(r);
  if (!s) return true;                       // no scale governs this record
  const g = F.range[s.key];
  if (!g) return true;                       // control not built, so inactive
  const v = s.valueOf(r);
  if (v == null) return true;                // never hide a record for lacking a value
  return v >= g.from && v <= g.to;
}
function chip(row, label, set, val, cls){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip" + (cls ? " " + cls : "");
  b.textContent = label;
  b.setAttribute("aria-pressed", "false");     // state is not colour alone
  b.onclick = () => { set.has(val) ? set.delete(val) : set.add(val);
                      b.classList.toggle("on");
                      b.setAttribute("aria-pressed", String(set.has(val)));
                      refresh(); };
  $(row).appendChild(b);
}
function buildFilters(){
  const kinds = [...new Set(DATA.map(r=>r._kind))];
  if (kinds.length > 1){ chip("#f-kind","Spells",F.kind,"spell"); chip("#f-kind","Monsters",F.kind,"monster"); }
  const syss = [...new Set(DATA.map(r=>r.gameSystem))];
  if (syss.includes("dnd5e")) chip("#f-sys","D&D 5e",F.sys,"dnd5e","dnd");
  if (syss.includes("pf2e"))  chip("#f-sys","Pathfinder 2e",F.sys,"pf2e","pf");
  if (DATA.some(r=>r._kind==="spell")){
    chip("#f-extra","Cantrips",F.extra,"cantrip");
    chip("#f-extra","Focus",F.extra,"focus");
    chip("#f-extra","Rituals",F.extra,"ritual");
    chip("#f-extra","Has save",F.extra,"save");
    chip("#f-extra","Heightened",F.extra,"height");
  }
  buildRangeControls();
}
/* Options come from the loaded records, not hardcoded bounds, so a future book
   that adds CR 31 extends the control on its own. */
function buildRangeControls(){
  const host = $("#f-range");
  for (const s of SCALES){
    const seen = new Map();                  // value -> label
    for (const r of DATA)
      if (s.applies(r)){
        const v = s.valueOf(r);
        if (v != null && !seen.has(v)) seen.set(v, s.labelOf(r));
      }
    if (seen.size < 2) continue;             // nothing to range over
    const vals = [...seen.keys()].sort((a,b) => a - b);

    // min/max record the scale's full extent, so "is this range active?" is
    // answerable without rescanning the corpus. passRange ignores them.
    F.range[s.key] = { from: vals[0], to: vals[vals.length - 1],
                       min: vals[0], max: vals[vals.length - 1] };

    const box = document.createElement("div");
    box.className = "rng";
    box.dataset.scale = s.key;
    const opts = vals.map(v => `<option value="${v}">${esc(seen.get(v))}</option>`).join("");
    box.innerHTML =
      `<span class="lbl">${esc(s.label)}</span>` +
      `<div class="row">` +
        `<select data-end="from" aria-label="${esc(s.label)} from">${opts}</select>` +
        `<span class="to">to</span>` +
        `<select data-end="to" aria-label="${esc(s.label)} to">${opts}</select>` +
      `</div>`;
    host.appendChild(box);

    const [selFrom, selTo] = box.querySelectorAll("select");
    selTo.value = String(vals[vals.length - 1]);
    selFrom.onchange = selTo.onchange = e => {
      const g = F.range[s.key];
      g[e.target.dataset.end] = Number(e.target.value);
      // an empty range cannot be created by accident: push the other end along
      if (g.from > g.to){
        if (e.target.dataset.end === "from"){ g.to = g.from; selTo.value = String(g.to); }
        else { g.from = g.to; selFrom.value = String(g.from); }
      }
      refresh();
    };
  }
}
/* Driven by the chip filters only — not by the query and not by the ranges
   themselves. A range matching nothing must keep its control on screen, or
   there is no way to widen it again. */
/* A collapsed panel that hides active filters is a trap, so the summary carries
   the count and the panel refuses to look empty when it isn't. */
function activeFilterCount(){
  let n = F.kind.size + F.sys.size + F.extra.size;
  for (const s of SCALES){
    const g = F.range[s.key];
    if (g && (g.from !== g.min || g.to !== g.max)) n++;
  }
  if ($("#deep").checked) n++;
  return n;
}
function updateFilterCount(){
  const n = activeFilterCount(), el = $("#fcount");
  el.hidden = n === 0;
  el.textContent = n;
  $("#filters > summary").setAttribute("aria-label",
    n ? `Filters, ${n} active` : "Filters");
}

function updateRangeVisibility(chipped){
  for (const s of SCALES){
    const box = document.querySelector(`.rng[data-scale="${s.key}"]`);
    if (box) box.hidden = !chipped.some(r => s.applies(r));
  }
}
function passExtra(r){
  if (!F.extra.size) return true;
  for (const f of F.extra){
    if (f==="cantrip" && r._kind==="spell" && r.identity.cantrip) return true;
    if (f==="focus"   && r._kind==="spell" && r.level.kind==="focus") return true;
    if (f==="ritual"  && r._kind==="spell" && r.identity.ritual) return true;
    if (f==="save"    && r._kind==="spell" && r.save) return true;
    if (f==="height"  && r._kind==="spell" && r.heightening.length) return true;
  }
  return false;
}
function deepText(r){
  if (r._deep === null){
    let t = r.name + " " + (r.entries||[]).join(" ");
    if (r._kind === "spell"){
      t += " " + (r.identity.traits||[]).join(" ") + " " + (r.identity.school||"");
      t += " " + (r.identity.classes||[]).join(" ") + " " + (r.identity.traditions||[]).join(" ");
      if (r.save) t += " " + Object.values(r.save.outcomes||{}).join(" ");
      t += " " + (r.heightening||[]).map(h=>h.text).join(" ");
    } else {
      t += " " + (r.entries||[]).map(e => e.name + " " + (e.entries||[]).join(" ")).join(" ");
    }
    r._deep = t.toLowerCase();
  }
  return r._deep;
}

/* ---------------- search ---------------- */
function refresh(){
  const q = $("#q").value.trim().toLowerCase();
  const deep = $("#deep").checked;
  // chipped is everything the chips allow, before ranges and before the query.
  // Range control visibility is computed from it in Task 3 — deliberately not
  // from the final view, or a range matching nothing would hide the control
  // needed to widen it again.
  const chipped = DATA.filter(r => {
    if (F.kind.size && !F.kind.has(r._kind)) return false;
    if (F.sys.size && !F.sys.has(r.gameSystem)) return false;
    return passExtra(r);
  });
  updateRangeVisibility(chipped);
  updateFilterCount();
  view = chipped.filter(r => {
    if (!passRange(r)) return false;
    if (!q) return true;
    return deep ? deepText(r).includes(q) : r._search.includes(q);
  });
  // exact-prefix matches first
  if (q) view.sort((a,b) => (a._search.startsWith(q)?0:1) - (b._search.startsWith(q)?0:1)
                            || a.name.localeCompare(b.name));
  $("#count").textContent = view.length.toLocaleString() + " of " + DATA.length.toLocaleString();
  renderList();
}
const CAP = 400;
function renderList(){
  const L = $("#list");
  const shown = view.slice(0, CAP);
  L.innerHTML = shown.map((r,i) =>
    `<div class="item ${r.gameSystem}" role="option" id="opt-${i}" aria-selected="false" data-i="${i}">
       <span class="nm">${esc(r.name)}</span>
       <span class="lv">${esc(r.variant||"")} · ${esc(tag(r))}</span>${
       // mouse affordance for the tracker; hidden from AT because a focusable
       // child would break the option role — keyboard adds via Enter on the listbox
       r._kind === "monster" ? '<button class="add" type="button" tabindex="-1" aria-hidden="true" title="Add to encounter">+</button>' : ""}
     </div>`).join("");
  L.querySelectorAll(".item[data-i]").forEach(el =>
    el.onclick = () => pick(+el.dataset.i));
  L.removeAttribute("aria-activedescendant");
  // the overflow note lives outside the listbox: a listbox may only own options
  const more = $("#more"), over = view.length - CAP;
  more.hidden = over <= 0;
  more.textContent = over > 0 ? `…${over.toLocaleString()} more — narrow your search` : "";
  sel = -1;
}
function tag(r){
  if (r._kind === "spell"){
    const l = r.level;
    if (r.identity.cantrip) return "cantrip";
    if (l.kind === "focus") return "focus " + (l.value ?? "?");
    return (l.kind === "rank" ? "rank " : "lvl ") + (l.value ?? "?");
  }
  const c = r.challenge;
  // pf2e display already reads "Creature 9"; only CR needs the prefix
  return c.kind === "cr" ? "CR " + (c.display ?? "?") : (c.display ?? "?");
}
function pick(i){
  sel = i;
  const L = $("#list");
  L.querySelectorAll(".item").forEach((el,k) => {
    const on = k === i;
    el.classList.toggle("sel", on);
    el.setAttribute("aria-selected", String(on));
    if (on) L.setAttribute("aria-activedescendant", el.id);
  });
  const r = view[i]; if (!r) return;
  $("#pane").className = r.gameSystem;      // sets the paper stock for this record
  $("#pane").innerHTML = r._kind === "spell" ? spellHTML(r) : monsterHTML(r);
  $("#pane").scrollTop = 0;
  location.hash = encodeURIComponent(r.id);
}

/* ---------------- renderers ---------------- */
function glyph(a){
  if (!a) return "";
  if (a.symbol) return a.symbol;
  const n = a.number, u = a.unit;
  if (!u) return "—";
  if (u === "action" || u === "bonus" || u === "reaction" || u === "free")
    return (n ?? "") + " " + u + (n > 1 ? "s" : "");
  return (n != null ? n + " " : "") + u + (n > 1 ? "s" : "");
}
function kv(label, val){ return val ? `<div class="kv"><b>${label}</b> <span>${esc(val)}</span></div>` : ""; }
/* a labelled row whose value is a single number worth picking out of the block */
function chipKV(label, value, qual){
  return `<div class="kv"><b>${esc(label)}</b><span class="chips">` +
         `<span class="statchip">${esc(value)}</span>` +
         (qual ? `<span class="qual">${esc(qual)}</span>` : "") + `</span></div>`;
}

const DEGLABEL = {criticalSuccess:"Critical Success", success:"Success",
                  failure:"Failure", criticalFailure:"Critical Failure"};

function spellHTML(r){
  const id = r.identity, lv = r.level;
  let h = `<div class="sb"><h2><span>${esc(r.name)}</span>
      <span class="rank">${esc(lv.display || "")}</span></h2><div class="rule"></div>`;

  const traits = [];
  if (id.rarity && id.rarity !== "common") traits.push([id.rarity, "rarity"]);
  (id.traits||[]).forEach(t => { if (t !== id.rarity) traits.push([t, ""]); });
  if (id.school) traits.push([id.school, ""]);
  if (id.cantrip && !(id.traits||[]).includes("cantrip")) traits.push(["cantrip",""]);
  if (id.ritual) traits.push(["ritual",""]);
  if (traits.length)
    h += `<div class="traits">${traits.map(([t,c]) =>
          `<span class="trait ${c}">${esc(t)}</span>`).join("")}</div>`;

  if (id.traditions && id.traditions.length) h += kv("Traditions", id.traditions.join(", "));
  if (id.classes && id.classes.length) h += kv("Classes", id.classes.join(", "));

  const cast = glyph(r.activity) +
    (r.activity && r.activity.numberMax ? ` (up to ${r.activity.numberMax} actions)` : "") +
    (r.components.list.length ? ` (${r.components.list.join(", ")})` : "");
  if (cast.trim()) h += `<div class="kv"><b>Cast</b> <span class="act">${esc(cast)}</span></div>`;
  if (r.trigger) h += kv("Trigger", r.trigger);
  if (r.components.material){
    let m = r.components.material;
    if (r.components.cost) m += ` — ${r.components.cost} ${r.components.currency||""}`;
    if (r.components.consumed) m += " (consumed)";
    h += kv("Material", m);
  }
  if (r.range && r.range.text) h += kv("Range", r.range.text);
  if (r.area && r.area.text) h += kv("Area", r.area.text);
  if (r.targets) h += kv("Targets", r.targets);
  if (r.duration && r.duration.text) h += kv("Duration", r.duration.text);

  if (r.save){
    let s = (r.save.basic ? "basic " : "") + (r.save.defense || "—");
    h += `<div class="kv"><b>Saving Throw</b> <span>${esc(s)}</span></div>`;
  }
  if (r.attack) h += kv("Attack", (r.attack.vs === "ac" ? "spell attack roll vs AC"
                                                        : (r.attack.vs||"") + " spell attack"));
  if (r.damage && r.damage.length)
    h += kv("Damage", r.damage.map(d => d.formula + (d.type ? " " + d.type : "")).join(", "));

  if (r.entries.length){
    h += `<div class="sec">Description</div><div class="body">` +
         r.entries.map(p => `<p>${esc(p)}</p>`).join("") + `</div>`;
  }

  const oc = r.save && r.save.outcomes;
  if (oc && Object.keys(oc).length){
    h += `<div class="sec">Degrees of Success</div>`;
    for (const k of ["criticalSuccess","success","failure","criticalFailure"])
      if (oc[k]) h += `<div class="deg"><b>${DEGLABEL[k]}</b> ${esc(oc[k])}</div>`;
  }
  if (r.heightening.length){
    h += `<div class="sec">Heightening</div>`;
    for (const ht of r.heightening){
      const lbl = ht.kind === "increment" ? `Heightened (+${ht.step})`
                : ht.kind === "fixed"     ? `Heightened (${ht.atRank})`
                : "Using a Higher-Level Spell Slot";
      h += `<div class="ht"><b>${esc(lbl)}</b><br>${esc(ht.text)}</div>`;
    }
  }
  h += metaHTML(r);
  return h + `</div>`;
}

function monsterHTML(r){
  const d = r.defenses, id = r.identity;
  let h = `<div class="sb"><h2><span>${esc(r.name)}</span>
      <span class="rank">${esc(r.challenge.kind === "cr" ? "CR " + r.challenge.display
                                                         : r.challenge.display)}</span>
      </h2><div class="rule"></div>`;
  const tr = [];
  if (id.rarity && id.rarity !== "common") tr.push([id.rarity,"rarity"]);
  if (id.alignment && id.alignment.raw) tr.push([id.alignment.raw,""]);
  if (id.size) tr.push([id.size,""]);
  (id.types||[]).concat(id.subtypes||[]).forEach(t => tr.push([t,""]));
  if (tr.length) h += `<div class="traits">${tr.map(([t,c]) =>
        `<span class="trait ${c}">${esc(t)}</span>`).join("")}</div>`;

  if (r.perception && r.perception.mod != null){
    let p = (r.perception.mod >= 0 ? "+" : "") + r.perception.mod;
    if (r.perception.passive != null) p += ` (passive ${r.perception.passive})`;
    if (r.senses.length) p += "; " + r.senses.map(s =>
      s.name + (s.range ? " " + s.range + " " + (s.unit||"ft") : "") +
      (s.acuity ? " (" + s.acuity + ")" : "")).join(", ");
    h += kv("Perception", p);
  }
  if (r.languages.length) h += kv("Languages", r.languages.join(", "));
  if (r.skills.length) h += kv("Skills", r.skills.map(s =>
      s.name + " " + (s.mod>=0?"+":"") + s.mod).join(", "));

  if (r.abilityMods){
    h += `<div class="grid6">` + ["str","dex","con","int","wis","cha"].map(k => {
      const m = r.abilityMods[k], sc = r.abilityScores ? r.abilityScores[k] : null;
      return `<div class="ab"><div class="k">${k}</div>
              <div class="v">${m>=0?"+":""}${m}</div>
              ${sc!=null?`<div class="s">${sc}</div>`:""}</div>`;
    }).join("") + `</div>`;
  }

  h += `<div class="sec">Defense</div>`;
  // AC, saves and HP all read as chips: the numbers carry the chip, the detail
  // that qualifies them (armour note, hit dice formula) sits outside it.
  h += chipKV("AC", d.ac.value ?? "—", d.ac.note ? "(" + d.ac.note + ")" : "");
  if (d.savingThrows.length){
    const chips = d.savingThrows.map(s =>
      `<span class="statchip"><b>${esc(s.name)}</b>${esc((s.mod>=0?"+":"") + s.mod)}</span>`).join("");
    h += `<div class="kv"><b>Saves</b><span class="chips">${chips}` +
         (d.saveNote ? `<span class="qual">${esc(d.saveNote)}</span>` : "") +
         `</span></div>`;
  }
  h += `<div class="kv"><b>HP</b><span class="chips">` + d.hp.map(x =>
      `<span class="statchip">${esc(x.value ?? "—")}</span>` +
      ([x.formula, x.note].filter(Boolean).length
        ? `<span class="qual">${esc([x.formula ? "(" + x.formula + ")" : "", x.note].filter(Boolean).join(" "))}</span>`
        : "")).join("") + `</span></div>`;
  const im = d.immunities, imAll = [].concat(im.damage, im.conditions, im.other);
  if (imAll.length) h += kv("Immunities", imAll.join(", "));
  if (d.resistances.length) h += kv("Resistances", d.resistances.map(x =>
      x.name + (x.amount!=null ? " " + x.amount : "") + (x.note ? " ("+x.note+")" : "")).join(", "));
  if (d.weaknesses.length) h += kv("Weaknesses", d.weaknesses.map(x =>
      x.name + (x.amount!=null ? " " + x.amount : "")).join(", "));

  const sp = Object.entries(r.speeds.modes||{}).map(([k,v]) => k + " " + v + " ft");
  if (r.speeds.special && r.speeds.special.length) sp.push(...r.speeds.special);
  if (sp.length){ h += `<div class="sec">Offense</div>` + kv("Speed", sp.join(", ")); }

  const order = ["traits","mid","actions","bot","bonusActions","reactions","legendary","mythic","lair"];
  // placement codes are how the books lay a block out, not what a GM calls them
  const SECLABEL = {traits:"Traits", mid:"Defensive Abilities", actions:"Actions",
                    bot:"Strikes & Abilities", bonusActions:"Bonus Actions",
                    reactions:"Reactions", legendary:"Legendary Actions",
                    mythic:"Mythic Actions", lair:"Lair Actions"};
  const groups = {};
  for (const e of r.entries) (groups[e.placement] = groups[e.placement] || []).push(e);
  const keys = Object.keys(groups).sort((a,b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  for (const k of keys){
    h += `<div class="sec">${esc(SECLABEL[k] || k.replace(/([A-Z])/g," $1"))}</div>`;
    for (const e of groups[k]) h += entryHTML(e);
  }
  if (r.spellcasting.length){
    h += `<div class="sec">Spellcasting</div>`;
    for (const b of r.spellcasting){
      let head = b.name || (b.type + " spells");
      const bits = [];
      if (b.dc != null) bits.push("DC " + b.dc);
      if (b.attackBonus != null) bits.push("attack " + (b.attackBonus>=0?"+":"") + b.attackBonus);
      h += `<div class="ent"><span class="en">${esc(head)}</span>` +
           (bits.length ? ` <span style="color:var(--dim)">(${esc(bits.join(", "))})</span>` : "") + `</div>`;
      for (const l of b.levels||[]){
        const lbl = l.rankLabel || (l.rank===0 ? "Cantrips" : l.rank!=null ? "Rank "+l.rank : (l.uses||""));
        const extra = l.slots ? ` (${l.slots} slots)` : (l.uses && !l.rankLabel ? ` (${l.uses})` : "");
        h += `<div class="deg"><b>${esc(lbl)}${esc(extra)}</b> ${esc((l.spells||[]).map(s =>
              s.name + (s.uses ? ` (${s.uses})` : "")).join(", "))}</div>`;
      }
    }
  }
  h += metaHTML(r);
  return h + `</div>`;
}

// "1 action" under an Actions heading says nothing the heading didn't. Pathfinder
// symbols always carry cost, and so does any count above one (legendary 2, 3).
const IMPLIED_BY_SECTION = {action:1, reaction:1, bonus:1, legendary:1, free:1};
function showsActivity(a){
  if (!a) return false;
  if (a.symbol) return true;
  return !(a.number === 1 && IMPLIED_BY_SECTION[a.unit]);
}

function entryHTML(e){
  let h = `<div class="ent"><span class="en">${esc(e.name)}</span>`;
  if (showsActivity(e.activity))
    h += ` <span class="act${e.activity.symbol ? " sym" : ""}">${esc(glyph(e.activity))}</span>`;
  if (e.traits && e.traits.length)
    h += ` <span class="qual">(${esc(e.traits.join(", "))})</span>`;
  if (e.attack){
    const a = e.attack;
    h += ` <span class="act">${a.map ? a.map.map(x => (x>=0?"+":"")+x).join("/") : ""}</span>`;
    if (a.reach) h += ` <span class="qual">reach ${a.reach.value} ft</span>`;
    if (a.range_) h += ` <span class="qual">range ${a.range_.value} ft</span>`;
  }
  if (e.damage && e.damage.length)
    h += `<br><span style="color:var(--dim)">Damage</span> ${esc(e.damage.map(x =>
          x.formula + (x.type ? " " + x.type : "")).join(" plus "))}`;
  if (e.trigger) h += `<br><span style="color:var(--dim)"><b>Trigger</b> ${esc(e.trigger)}</span>`;
  if (e.requirements) h += `<br><span style="color:var(--dim)"><b>Requirements</b> ${esc(e.requirements)}</span>`;
  if (e.frequency){
    const f = e.frequency;
    const ft = f.number != null ? `${f.number} per ${f.unit}` : (f.text || "");
    if (ft) h += `<br><span style="color:var(--dim)"><b>Frequency</b> ${esc(ft)}</span>`;
  }
  for (const p of (e.entries||[])) h += `<div style="margin-top:4px">${esc(p)}</div>`;
  const oc = e.save && e.save.outcomes;
  if (e.save){
    const s = (e.save.basic ? "basic " : "") + (e.save.defense||"") +
              (e.save.dc != null ? " DC " + e.save.dc : "");
    if (s.trim()) h += `<div style="margin-top:4px;color:var(--dim)"><b>Save</b> ${esc(s)}</div>`;
  }
  if (oc) for (const k of ["criticalSuccess","success","failure","criticalFailure"])
    if (oc[k] && oc[k].length > 8) h += `<div class="deg"><b>${DEGLABEL[k]}</b> ${esc(oc[k])}</div>`;
  return h + `</div>`;
}

function metaHTML(r){
  let m = `<div class="meta">${esc(r.id)}`;
  if (r.source){
    let s = r.source.name || r.source.code || "";
    if (r.source.page && !/\bp\.?\s*\d/i.test(s)) s += " p." + r.source.page;
    if (s) m += `  ·  ${esc(s)}`;
  }
  m += `</div>`;
  if (r.parse && r.parse.warnings && r.parse.warnings.length)
    m += `<div class="warn"><b>Parse notes (${r.parse.status})</b><br>` +
         r.parse.warnings.map(esc).join("<br>") + `</div>`;
  return m;
}

/* ---------------- events ---------------- */
$("#q").addEventListener("input", refresh);
$("#deep").addEventListener("change", refresh);
document.addEventListener("keydown", e => {
  if (window.TRK && TRK.key(e)) return;      // tracker gets first refusal
  if (e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape"){ $("#q").value=""; refresh(); $("#q").focus(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    if (!view.length) return;
    e.preventDefault();
    const n = Math.min(view.length, CAP);
    pick(((sel + (e.key==="ArrowDown"?1:-1)) % n + n) % n);
    const el = $("#list").querySelector(".item.sel"); if (el) el.scrollIntoView({block:"nearest"});
  }
});
boot();
</script>

<script>
"use strict";
/* ================= initiative tracker =================
   One global: TRK. Reads DATA / monsterHTML / esc / $ from the first script,
   never shadows them. All persistent state lives in localStorage under
   bg.trk.*.v1 keys and passes through a validating merge on every load. */
const TRK = (() => {

  /* ---------------- persistence ---------------- */
  const LS = { enc:"bg.trk.enc.v1", party:"bg.trk.party.v1", presets:"bg.trk.presets.v1",
               dice:"bg.trk.dice.v1", ui:"bg.trk.ui.v1" };
  const load = (k, fb) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; }
                            catch(_){ return fb; } };
  const save = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} };

  const fin = (v, fb) => Number.isFinite(+v) ? +v : fb;         // finite number or fallback
  const int = (v, fb) => Number.isFinite(+v) ? Math.round(+v) : fb;

  /* Validating merges: stored data is untrusted (hand-edited, older schema,
     truncated write). Recognized fields are copied and clamped; everything
     else is dropped. Never re-sorts — array order carries the manual tie
     arrangement. */
  function vEnc(raw){
    const e = { name:"Encounter", round:0, activeId:null, seq:0, combatants:[],
                last:{kind:"dmg"} };
    if (!raw || typeof raw !== "object") return e;
    if (typeof raw.name === "string" && raw.name.trim()) e.name = raw.name.trim().slice(0, 80);
    e.round = Math.max(0, int(raw.round, 0));
    if (raw.last && raw.last.kind === "heal") e.last = {kind:"heal"};
    const seen = new Set();
    let maxN = 0;
    for (const c of Array.isArray(raw.combatants) ? raw.combatants : []){
      if (!c || typeof c !== "object") continue;
      if (typeof c.name !== "string" || !c.name.trim()) continue;
      let id = (typeof c.id === "string" && /^c\d+$/.test(c.id) && !seen.has(c.id)) ? c.id : null;
      if (id){ seen.add(id); maxN = Math.max(maxN, parseInt(id.slice(1), 10)); }
      const max = Math.max(1, int(c.hp && c.hp.max, 1));
      const cur = Math.min(max, Math.max(0, int(c.hp && c.hp.current, max)));
      e.combatants.push({
        id,
        name: c.name.trim().slice(0, 80),
        type: c.type === "player" || c.type === "monster" ? c.type : "npc",
        initiative: fin(c.initiative, 0),
        initiativeModifier: fin(c.initiativeModifier, 0),
        ac: c.ac == null ? null : (Number.isFinite(+c.ac) ? +c.ac : null),
        hp: { current: cur, max },
        status: cur === 0 ? "unconscious" : "normal",
        ref: typeof c.ref === "string" ? c.ref : null,
        sys: c.sys === "dnd5e" || c.sys === "pf2e" ? c.sys : null,
      });
    }
    for (const cb of e.combatants) if (!cb.id){ cb.id = "c" + (++maxN); }
    e.seq = Math.max(maxN, int(raw.seq, 0));
    e.activeId = (typeof raw.activeId === "string" &&
                  e.combatants.some(c => c.id === raw.activeId)) ? raw.activeId : null;
    if (e.round === 0) e.activeId = null;          // setup has no active turn
    return e;
  }
  function vParty(raw){
    const out = [];
    for (const p of Array.isArray(raw) ? raw : []){
      if (!p || typeof p !== "object" || typeof p.name !== "string" || !p.name.trim()) continue;
      out.push({ id: typeof p.id === "string" ? p.id : "p" + (out.length + 1),
                 name: p.name.trim().slice(0, 80),
                 type: p.type === "npc" ? "npc" : "player",
                 hpMax: p.hpMax == null ? null : Math.max(1, int(p.hpMax, 1)),
                 ac: p.ac == null ? null : (Number.isFinite(+p.ac) ? +p.ac : null),
                 mod: fin(p.mod, 0) });
    }
    return out;
  }
  function vDice(raw){
    const d = { history:[], ui:{ die:20, count:1, mod:0, adv:"normal" } };
    if (!raw || typeof raw !== "object") return d;
    if (Array.isArray(raw.history)) d.history = raw.history.slice(0, 12);
    const u = raw.ui || {};
    if ([4,6,8,10,12,20,100].includes(+u.die)) d.ui.die = +u.die;
    d.ui.count = Math.min(20, Math.max(1, int(u.count, 1)));
    d.ui.mod = Math.min(99, Math.max(-99, int(u.mod, 0)));
    if (u.adv === "advantage" || u.adv === "disadvantage") d.ui.adv = u.adv;
    return d;
  }
  function vPresets(raw){
    const out = [];
    for (const p of Array.isArray(raw) ? raw : []){
      if (!p || typeof p !== "object" || typeof p.name !== "string" || !p.name.trim()) continue;
      out.push({ id: typeof p.id === "string" ? p.id : "s" + (out.length + 1),
                 name: p.name.trim().slice(0, 80),
                 savedAt: int(p.savedAt, 0),
                 enc: vEnc(p.enc),
                 dice: vDice(p.dice) });
    }
    return out;
  }
  function vUi(raw){
    const u = { mode:"browse", qty:1, diceOpen:true };
    if (!raw || typeof raw !== "object") return u;
    if (raw.mode === "track") u.mode = "track";
    u.qty = Math.min(10, Math.max(1, int(raw.qty, 1)));
    u.diceOpen = raw.diceOpen !== false;
    return u;
  }

  /* ---------------- state ---------------- */
  const state = {
    enc:     vEnc(load(LS.enc, null)),
    party:   vParty(load(LS.party, null)),
    presets: vPresets(load(LS.presets, null)),
    dice:    vDice(load(LS.dice, null)),
    ui:      vUi(load(LS.ui, null)),
  };

  /* ---------------- shared helpers ---------------- */
  const announce = m => { const el = $("#trklive"); el.textContent = ""; el.textContent = m; };
  const byId = id => state.enc.combatants.find(c => c.id === id);
  const d20 = () => 1 + Math.floor(Math.random() * 20);

  /* Combatant stats from a record. The per-system initiative rule lives here:
     PF2e rolls initiative on Perception; 5e on DEX, except the 2025 SRD which
     prints an explicit modifier (systemExtras.initiative). */
  function initModOf(r){
    if (r.gameSystem === "pf2e") return r.perception?.mod ?? 0;
    return r.systemExtras?.initiative ?? r.abilityMods?.dex ?? 0;
  }
  const acOf = r => r.defenses?.ac?.value ?? null;
  const hpOf = r => r.defenses?.hp?.[0]?.value ?? null;

  /* ---------------- undo ring ---------------- */
  /* mutate() is the single choke point: every encounter change passes through
     it, so undo coverage is structural — reset and preset-load included. */
  const hist = { past: [], future: [] };
  function mutate(fn){
    hist.past.push(JSON.stringify(state.enc));
    if (hist.past.length > 50) hist.past.shift();
    hist.future.length = 0;
    fn(state.enc);
    state.enc = vEnc(state.enc);             // self-heal after every mutation
    save(LS.enc, state.enc);
    renderTrk(); pdPush();
  }
  function undo(){
    if (!hist.past.length) return;
    hist.future.push(JSON.stringify(state.enc));
    state.enc = vEnc(JSON.parse(hist.past.pop()));
    save(LS.enc, state.enc); renderTrk(); pdPush(); announce("Undone");
  }
  function redo(){
    if (!hist.future.length) return;
    hist.past.push(JSON.stringify(state.enc));
    state.enc = vEnc(JSON.parse(hist.future.pop()));
    save(LS.enc, state.enc); renderTrk(); pdPush(); announce("Redone");
  }
  function pdPush(){ /* player display — phase F */ }

  /* ---------------- naming ---------------- */
  /* "Goblin", then another goblin: the first retroactively becomes "Goblin 1"
     and numbering continues from the highest existing number. */
  function autoName(e, base, want){
    const rx = new RegExp("^" + base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "( (\\d+))?$");
    let plain = null; const nums = [];
    for (const c of e.combatants){
      const m = c.name.match(rx);
      if (!m) continue;
      if (m[2] == null) plain = c; else nums.push(+m[2]);
    }
    if (!plain && !nums.length && want === 1) return [base];
    if (plain){ plain.name = base + " 1"; nums.push(1); }
    let n = nums.length ? Math.max(...nums) : 0;
    return Array.from({length: want}, () => base + " " + (++n));
  }

  /* ---------------- actions ---------------- */
  const sortEnc = e => e.combatants.sort((a,b) => b.initiative - a.initiative); // stable: ties keep order
  function addMany(spec, count){
    const n = Math.min(10, Math.max(1, int(count, 1)));
    mutate(e => {
      const names = autoName(e, spec.name, n);
      for (const nm of names){
        const mid = e.round >= 1 && spec.type !== "player";   // mid-combat adds roll in
        e.combatants.push({
          id: "c" + (++e.seq), name: nm, type: spec.type,
          initiative: mid ? d20() + spec.mod : 0,
          initiativeModifier: spec.mod,
          ac: spec.ac, hp: { current: spec.hpMax, max: spec.hpMax },
          status: "normal", ref: spec.ref ?? null, sys: spec.sys ?? null,
        });
      }
      if (e.round >= 1) sortEnc(e);
    });
    announce(n === 1 ? spec.name + " added" : spec.name + " ×" + n + " added");
  }
  function addFromView(i){
    const r = view[i];
    if (!r || r._kind !== "monster") return;
    const hp = hpOf(r);
    if (hp == null){                 // ~95 PF2e hazard-like records: never fabricate HP
      openAddForm({ name: r.name, type: "monster", mod: initModOf(r),
                    ac: acOf(r), ref: r.id, sys: r.gameSystem });
      return;
    }
    addMany({ name: r.name, type: "monster", hpMax: hp, ac: acOf(r),
              mod: initModOf(r), ref: r.id, sys: r.gameSystem }, state.ui.qty);
  }
  function removeCombatant(id){
    mutate(e => {
      const i = e.combatants.findIndex(c => c.id === id);
      if (i < 0) return;
      const wasActive = e.activeId === id;
      const nm = e.combatants[i].name;
      e.combatants.splice(i, 1);
      if (wasActive)                             // positional repair, not a turn
        e.activeId = e.combatants.length
          ? e.combatants[Math.min(i, e.combatants.length - 1)].id : null;
      announce(nm + " removed");
    });
  }
  function applyHP(id, amount, kind){
    const amt = Math.abs(int(amount, 0));
    if (!amt) return false;
    mutate(e => {
      const c = e.combatants.find(x => x.id === id);
      if (!c) return;
      c.hp.current = Math.min(c.hp.max, Math.max(0, c.hp.current + (kind === "heal" ? amt : -amt)));
      e.last = { kind: kind === "heal" ? "heal" : "dmg" };
      announce(c.name + (kind === "heal" ? " healed to " : " damaged to ") + c.hp.current + " HP");
    });
    return true;
  }

  /* ---------------- combat flow ---------------- */
  function startCombat(map){                  // map: combatant id -> initiative
    mutate(e => {
      for (const c of e.combatants) if (map.has(c.id)) c.initiative = map.get(c.id);
      sortEnc(e);
      e.round = 1;
      e.activeId = e.combatants[0]?.id ?? null;
    });
  }
  function endCombat(){                        // back to setup; combatants and HP kept
    mutate(e => { e.round = 0; e.activeId = null; });
    announce("Combat ended");
  }
  function canPrev(){
    const e = state.enc;
    if (e.round < 1 || !e.combatants.length) return false;
    const i = e.combatants.findIndex(c => c.id === e.activeId);
    return !(i <= 0 && e.round === 1);        // can't step before combat start
  }
  function nextTurn(){
    const e = state.enc;
    if (e.round < 1 || !e.combatants.length) return;
    mutate(x => {
      const i = x.combatants.findIndex(c => c.id === x.activeId);
      const n = i + 1;
      if (n >= x.combatants.length){ x.activeId = x.combatants[0].id; x.round++; }
      else x.activeId = x.combatants[n].id;
    });
    afterTurn();
  }
  function prevTurn(){
    if (!canPrev()) return;                   // checked BEFORE mutate: no-ops don't pollute undo
    mutate(x => {
      const i = x.combatants.findIndex(c => c.id === x.activeId);
      if (i <= 0){ x.round--; x.activeId = x.combatants[x.combatants.length - 1].id; }
      else x.activeId = x.combatants[i - 1].id;
    });
    afterTurn();
  }
  function afterTurn(){
    const c = byId(state.enc.activeId);
    if (c) announce("Round " + state.enc.round + " — " + c.name + "'s turn");
    scrollActive();
  }
  function scrollActive(){
    const el = $("#trklist").querySelector(".cbt.on");
    if (el) el.scrollIntoView({ block: "nearest" });
  }
  function resetEnc(){                         // keep players, drop the rest
    mutate(e => {
      e.combatants = e.combatants.filter(c => c.type === "player");
      e.combatants.forEach(c => { c.initiative = 0; });
      e.round = 0; e.activeId = null;
    });
    announce("Encounter reset — players kept");
  }
  function clearAll(){
    mutate(e => { e.combatants = []; e.round = 0; e.activeId = null; });
    announce("Encounter cleared");
  }

  /* ---------------- initiative editing & reorder ---------------- */
  function setInitiative(id, v){
    mutate(e => {
      const c = e.combatants.find(x => x.id === id);
      if (c) c.initiative = v;
      sortEnc(e);                              // stable: manual tie arrangement survives
    });
  }
  /* integer midpoint: the dragged combatant takes floor-ish middle ground;
     at the edges it goes one above the top or one below the bottom */
  function midInit(arr, i){
    const above = i > 0 ? arr[i - 1].initiative : null;
    const below = i < arr.length - 1 ? arr[i + 1].initiative : null;
    if (above == null && below == null) return arr[i].initiative;
    if (above == null) return below + 1;
    if (below == null) return above - 1;
    return Math.round((above + below) / 2);
  }
  function reorderTo(id, beforeId){            // drop ON a card = take its slot
    if (id === beforeId) return;
    mutate(e => {
      const from = e.combatants.findIndex(c => c.id === id);
      if (from < 0) return;
      const [c] = e.combatants.splice(from, 1);
      let to = beforeId ? e.combatants.findIndex(x => x.id === beforeId) : e.combatants.length;
      if (to < 0) to = e.combatants.length;
      e.combatants.splice(to, 0, c);
      c.initiative = midInit(e.combatants, to);
    });
  }
  function canMove(id, delta){
    const e = state.enc;
    const i = e.combatants.findIndex(c => c.id === id);
    const j = i + delta;
    return i >= 0 && j >= 0 && j < e.combatants.length;
  }
  function moveBy(id, delta){
    if (!canMove(id, delta)) return;
    mutate(e => {
      const i = e.combatants.findIndex(c => c.id === id);
      const [c] = e.combatants.splice(i, 1);
      e.combatants.splice(i + delta, 0, c);
      c.initiative = midInit(e.combatants, i + delta);
    });
  }
  function editInit(span){
    const card = span.closest(".cbt");
    const c = byId(card.dataset.id);
    if (!c || state.enc.round < 1) return;
    const inp = document.createElement("input");
    inp.type = "number"; inp.className = "cbt-init-edit";
    inp.value = c.initiative;
    inp.setAttribute("aria-label", "Initiative for " + c.name);
    span.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const commit = ok => {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (ok && v !== "" && Number.isFinite(+v) && Math.round(+v) !== c.initiative)
        setInitiative(c.id, Math.round(+v));
      else renderTrk();                        // restore without polluting undo
    };
    inp.onblur = () => commit(true);
    inp.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); commit(true); }
      else if (e.key === "Escape"){ e.stopPropagation(); commit(false); }
    };
  }
  function editName(){
    const span = $("#trkname");
    const inp = document.createElement("input");
    inp.className = "trkname-edit"; inp.maxLength = 80;
    inp.value = state.enc.name;
    inp.setAttribute("aria-label", "Encounter name");
    span.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const commit = ok => {
      if (done) return; done = true;
      const v = inp.value.trim();
      inp.replaceWith(span);                  // restore BEFORE render so #trkname resolves
      if (ok && v && v !== state.enc.name) mutate(e => { e.name = v; });
      span.focus();
    };
    inp.onblur = () => commit(true);
    inp.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); commit(true); }
      else if (e.key === "Escape"){ e.stopPropagation(); commit(false); }
    };
  }

  /* ---------------- start-combat modal ---------------- */
  function openStartModal(){
    const e = state.enc;
    if (!e.combatants.length) return;
    const rows = e.combatants.map(c => {
      if (c.type === "player")
        return `<div class="srow" data-id="${c.id}">
          <span class="srnm">${esc(c.name)}</span>
          <input type="number" class="sinit" min="-5" max="45" aria-label="Initiative for ${esc(c.name)}">
        </div>`;
      const r = d20();
      return `<div class="srow" data-id="${c.id}" data-roll="${r}">
        <span class="srnm">${esc(c.name)}</span>
        <span class="sbreak">d20 ${r} ${c.initiativeModifier >= 0 ? "+" : "−"} ${Math.abs(c.initiativeModifier)}</span>
        <span class="stot">${r + c.initiativeModifier}</span>
        <button type="button" class="chip sre" aria-label="Reroll for ${esc(c.name)}">↻</button>
      </div>`;
    }).join("");
    openOvl(`<form id="startform" novalidate>
      <h3>Roll initiative</h3>
      <div class="warn" id="sf-warn" hidden></div>
      <div class="srows">${rows}</div>
      <div class="btns">
        <button type="button" class="chip" data-close>Cancel</button>
        <button type="submit" class="chip yes">Begin combat</button>
      </div>
    </form>`);
    const form = $("#startform");
    form.querySelector("[data-close]").onclick = closeOvl;
    form.addEventListener("click", ev => {
      const b = ev.target.closest(".sre"); if (!b) return;
      const row = b.closest(".srow");
      const c = byId(row.dataset.id);
      const r = d20();
      row.dataset.roll = r;
      row.querySelector(".sbreak").textContent =
        `d20 ${r} ${c.initiativeModifier >= 0 ? "+" : "−"} ${Math.abs(c.initiativeModifier)}`;
      row.querySelector(".stot").textContent = r + c.initiativeModifier;
    });
    form.onsubmit = ev => {
      ev.preventDefault();
      const map = new Map(); const missing = [];
      form.querySelectorAll(".srow").forEach(row => {
        const c = byId(row.dataset.id); if (!c) return;
        const inp = row.querySelector(".sinit");
        if (inp){
          const v = inp.value.trim();
          if (v === "" || !Number.isFinite(+v)){
            missing.push(c.name); inp.setAttribute("aria-invalid", "true");
          } else {
            inp.setAttribute("aria-invalid", "false");
            map.set(c.id, Math.round(+v));
          }
        } else map.set(c.id, +row.dataset.roll + c.initiativeModifier);
      });
      const w = $("#sf-warn");
      if (missing.length){                     // visible, never silent
        w.hidden = false;
        w.textContent = "Enter initiative for: " + missing.join(", ");
        form.querySelector('.sinit[aria-invalid="true"]').focus();
        return;
      }
      startCombat(map);
      closeOvl();
      const first = byId(state.enc.activeId);
      announce("Combat started — " + (first ? first.name + " acts first" : ""));
      scrollActive();
    };
  }

  /* ---------------- cards ---------------- */
  function hpClass(c){
    if (c.hp.current === 0) return "";
    const p = c.hp.current / c.hp.max;
    return p > .5 ? "hp-hi" : p > .25 ? "hp-mid" : "hp-lo";
  }
  function cardHTML(c){
    const spine = c.type === "player" ? "pc" : (c.sys || "");
    const pct = Math.round(100 * c.hp.current / c.hp.max);
    const combat = state.enc.round >= 1;
    const active = combat && c.id === state.enc.activeId;
    const init = combat
      ? `<button type="button" class="cbt-init" data-act="init"
           aria-label="Initiative ${esc(c.initiative)} for ${esc(c.name)} — press Enter to edit">${esc(c.initiative)}</button>`
      : `<span class="cbt-init">—</span>`;
    return `<div class="cbt ${spine}${c.status === "unconscious" ? " ko" : ""}${active ? " on" : ""}"
      role="listitem" tabindex="0" data-id="${c.id}" draggable="${combat}"
      ${active ? 'aria-current="true"' : ""}>
      <div class="cbt-r1">
        ${init}
        <span class="cbt-nm">${esc(c.name)}</span>
        ${c.status === "unconscious" ? '<span class="kochip">unconscious</span>' : ""}
        <span class="cbt-ac">${c.ac == null ? "AC —" : "AC " + esc(c.ac)}</span>
        <button type="button" class="cbt-x" data-act="x" aria-label="Remove ${esc(c.name)}">✕</button>
      </div>
      <div class="cbt-r2">
        <span class="hpbar"><i class="${hpClass(c)}" style="width:${pct}%"></i></span>
        <span class="cbt-hp">${c.hp.current}/${c.hp.max}</span>
        <input class="cbt-amt" type="number" min="0" inputmode="numeric"
               aria-label="Hit point amount for ${esc(c.name)}">
        <button type="button" class="dmg" data-act="dmg" aria-label="Damage ${esc(c.name)}">−</button>
        <button type="button" class="heal" data-act="heal" aria-label="Heal ${esc(c.name)}">+</button>
      </div>
    </div>`;
  }

  /* ---------------- inline confirm (never window.confirm) ---------------- */
  function confirmSwap(btn, label, onYes){
    const host = document.createElement("span");
    host.className = "cfm";
    host.innerHTML = `<span>${esc(label)}</span>` +
      `<button type="button" class="chip yes">Yes</button>` +
      `<button type="button" class="chip">No</button>`;
    const [yes, no] = host.querySelectorAll("button");
    const t = setTimeout(revert, 5000);
    function revert(){ clearTimeout(t); host.replaceWith(btn); btn.focus(); }
    yes.onclick = () => { clearTimeout(t); onYes(); };
    no.onclick = revert;
    host.addEventListener("keydown", e => {
      if (e.key === "Escape"){ e.stopPropagation(); revert(); } });
    btn.replaceWith(host);
    yes.focus();
  }

  /* ---------------- overlay ---------------- */
  let ovlReturn = null;
  function openOvl(html){
    ovlReturn = document.activeElement;
    const o = $("#trkovl");
    o.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;
    o.hidden = false;
    o.onclick = e => { if (e.target === o) closeOvl(); };
    const f = o.querySelector("input,select,textarea,button");
    if (f) f.focus();
  }
  function closeOvl(){
    const o = $("#trkovl");
    if (o.hidden) return;
    o.hidden = true; o.innerHTML = ""; o.onclick = null;
    if (ovlReturn && ovlReturn.isConnected) ovlReturn.focus();
    ovlReturn = null;
  }

  /* ---------------- add form ---------------- */
  function openAddForm(pre = {}){
    const opts = n => Array.from({length: 10}, (_, i) =>
      `<option${i + 1 === n ? " selected" : ""}>${i + 1}</option>`).join("");
    openOvl(`<form id="addform" novalidate>
      <h3>Add combatant</h3>
      <div class="warn" id="af-warn" hidden></div>
      <label>Name <input name="name" maxlength="80" value="${esc(pre.name ?? "")}"></label>
      <label>Type <select name="type">
        <option value="player"${!pre.type || pre.type === "player" ? " selected" : ""}>Player</option>
        <option value="npc"${pre.type === "npc" ? " selected" : ""}>NPC</option>
        <option value="monster"${pre.type === "monster" ? " selected" : ""}>Monster</option>
      </select></label>
      <div class="row2">
        <label>Max HP <input name="hp" type="number" min="1" max="99999" value="${pre.hpMax ?? ""}"></label>
        <label>AC <input name="ac" type="number" min="0" max="99" value="${pre.ac ?? ""}"></label>
      </div>
      <div class="row2">
        <label>Initiative modifier <input name="mod" type="number" min="-10" max="50" value="${esc(pre.mod ?? 0)}"></label>
        <label>Count <select name="count">${opts(pre.ref ? 1 : state.ui.qty)}</select></label>
      </div>
      <div class="btns">
        <button type="button" class="chip" data-close>Cancel</button>
        <button type="submit" class="chip yes">Add</button>
      </div>
    </form>`);
    const form = $("#addform");
    form.dataset.ref = pre.ref ?? ""; form.dataset.sys = pre.sys ?? "";
    form.querySelector("[data-close]").onclick = closeOvl;
    form.onsubmit = ev => {
      ev.preventDefault();
      const fd = new FormData(form);
      const name = String(fd.get("name") || "").trim();
      const hp = int(fd.get("hp"), 0);
      const errs = [];
      if (!name) errs.push("a name");
      if (hp < 1) errs.push("max HP");
      form.querySelector("[name=name]").setAttribute("aria-invalid", String(!name));
      form.querySelector("[name=hp]").setAttribute("aria-invalid", String(hp < 1));
      const w = $("#af-warn");
      if (errs.length){                        // visible validation, never silent
        w.hidden = false;
        w.textContent = "Enter " + errs.join(" and ") + ".";
        form.querySelector(errs[0] === "a name" ? "[name=name]" : "[name=hp]").focus();
        return;
      }
      const acRaw = String(fd.get("ac") ?? "").trim();
      addMany({ name, type: String(fd.get("type")), hpMax: hp,
                ac: acRaw === "" ? null : int(acRaw, null),
                mod: Math.min(50, Math.max(-10, int(fd.get("mod"), 0))),
                ref: form.dataset.ref || null, sys: form.dataset.sys || null },
              int(fd.get("count"), 1));
      closeOvl();
    };
  }

  /* ---------------- keyboard ---------------- */
  function key(e){
    const o = $("#trkovl");
    if (!o.hidden){                           // dialog is modal to shortcuts
      if (e.key === "Escape"){ closeOvl(); return true; }
      if (e.key === "Tab"){
        const f = [...o.querySelectorAll("input,select,textarea,button")].filter(x => !x.disabled);
        if (f.length){
          if (!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
          else if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
        }
      }
      return true;                            // native typing unaffected; app shortcuts swallowed
    }
    const t = e.target;
    if (t && t.closest && (t.closest("input,textarea,select") || t.isContentEditable)) return false;
    if (state.ui.mode !== "track") return false;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === "z" && !e.shiftKey){ e.preventDefault(); undo(); return true; }
    if (mod && (k === "y" || (k === "z" && e.shiftKey))){ e.preventDefault(); redo(); return true; }
    if (e.key === " "){
      // native activation wins when a control is focused
      if (t && t.closest && t.closest("button,summary,a,[role=button]")) return false;
      if (state.enc.round >= 1){ e.preventDefault(); nextTurn(); return true; }
      return false;
    }
    // arrows inside the tracker column must not drive the picker
    if ((e.key === "ArrowUp" || e.key === "ArrowDown") && t && t.closest && t.closest("#trk"))
      return true;                             // Alt+Arrow reorder already ran at the element
    return false;
  }

  /* ---------------- mode ---------------- */
  function setMode(m){
    state.ui.mode = m === "track" ? "track" : "browse";
    save(LS.ui, state.ui);
    const track = state.ui.mode === "track";
    document.body.classList.toggle("trk", track);
    $("#m-browse").classList.toggle("on", !track);
    $("#m-browse").setAttribute("aria-pressed", String(!track));
    $("#m-track").classList.toggle("on", track);
    $("#m-track").setAttribute("aria-pressed", String(track));
    if (track) renderTrk();
  }

  function renderTrk(){
    const e = state.enc, combat = e.round >= 1;
    const nameEl = $("#trkname");
    if (nameEl) nameEl.textContent = e.name;
    $("#trkround").textContent = combat ? "Round " + e.round : "Setup";
    $("#qty").value = String(state.ui.qty);
    $("#t-undo").disabled = !hist.past.length;
    $("#t-redo").disabled = !hist.future.length;
    $("#t-start").hidden = combat;
    $("#t-start").disabled = !e.combatants.length;
    $("#t-prev").hidden = $("#t-next").hidden = $("#t-end").hidden = !combat;
    $("#t-prev").disabled = !canPrev();
    $("#trklist").innerHTML = e.combatants.map(cardHTML).join("");
  }

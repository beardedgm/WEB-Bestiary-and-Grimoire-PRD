<script>
"use strict";
/* ================= initiative tracker =================
   One global: TRK. Reads DATA / monsterHTML / esc / $ from the first script,
   never shadows them. All persistent state lives in localStorage under
   bg.trk.*.v1 keys and passes through a validating merge on every load. */
const TRK = (() => {

  /* ---------------- persistence ---------------- */
  const LS = { enc:"bg.trk.enc.v1", party:"bg.trk.party.v1", presets:"bg.trk.presets.v1",
               dice:"bg.trk.dice.v1", ui:"bg.trk.ui.v1", pd:"bg.trk.pd.v1" };
  const load = (k, fb) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? fb; }
                            catch(_){ return fb; } };
  const save = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} };

  const fin = (v, fb) => Number.isFinite(+v) ? +v : fb;         // finite number or fallback
  const int = (v, fb) => Number.isFinite(+v) ? Math.round(+v) : fb;

  /* Validating merges: stored data is untrusted (hand-edited, older schema,
     truncated write). Recognized fields are copied and clamped; everything
     else is dropped. Never re-sorts — array order carries the manual tie
     arrangement. */
  function vEnc(raw){
    const e = { name:"Encounter", round:0, activeId:null, seq:0, combatants:[],
                last:{kind:"dmg"} };
    if (!raw || typeof raw !== "object") return e;
    if (typeof raw.name === "string" && raw.name.trim()) e.name = raw.name.trim().slice(0, 80);
    e.round = Math.max(0, int(raw.round, 0));
    if (raw.last && raw.last.kind === "heal") e.last = {kind:"heal"};
    const seen = new Set();
    let maxN = 0;
    for (const c of Array.isArray(raw.combatants) ? raw.combatants : []){
      if (!c || typeof c !== "object") continue;
      if (typeof c.name !== "string" || !c.name.trim()) continue;
      let id = (typeof c.id === "string" && /^c\d+$/.test(c.id) && !seen.has(c.id)) ? c.id : null;
      if (id){ seen.add(id); maxN = Math.max(maxN, parseInt(id.slice(1), 10)); }
      const max = Math.max(1, int(c.hp && c.hp.max, 1));
      const cur = Math.min(max, Math.max(0, int(c.hp && c.hp.current, max)));
      e.combatants.push({
        id,
        name: c.name.trim().slice(0, 80),
        type: c.type === "player" || c.type === "monster" ? c.type : "npc",
        initiative: fin(c.initiative, 0),
        initiativeModifier: fin(c.initiativeModifier, 0),
        ac: c.ac == null ? null : (Number.isFinite(+c.ac) ? +c.ac : null),
        hp: { current: cur, max },
        status: cur === 0 ? "unconscious" : "normal",
        ref: typeof c.ref === "string" ? c.ref : null,
        sys: c.sys === "dnd5e" || c.sys === "pf2e" ? c.sys : null,
      });
    }
    for (const cb of e.combatants) if (!cb.id){ cb.id = "c" + (++maxN); }
    e.seq = Math.max(maxN, int(raw.seq, 0));
    e.activeId = (typeof raw.activeId === "string" &&
                  e.combatants.some(c => c.id === raw.activeId)) ? raw.activeId : null;
    if (e.round === 0) e.activeId = null;          // setup has no active turn
    return e;
  }
  function vParty(raw){
    const out = [];
    for (const p of Array.isArray(raw) ? raw : []){
      if (!p || typeof p !== "object" || typeof p.name !== "string" || !p.name.trim()) continue;
      out.push({ id: typeof p.id === "string" ? p.id : "p" + (out.length + 1),
                 name: p.name.trim().slice(0, 80),
                 type: p.type === "npc" ? "npc" : "player",
                 hpMax: p.hpMax == null ? null : Math.max(1, int(p.hpMax, 1)),
                 ac: p.ac == null ? null : (Number.isFinite(+p.ac) ? +p.ac : null),
                 mod: fin(p.mod, 0) });
    }
    return out;
  }
  const DIES = [4, 6, 8, 10, 12, 20, 100];
  function vDiceEntry(h){
    if (!h || typeof h !== "object" || typeof h.label !== "string") return null;
    const s = h.spec || {};
    if (!DIES.includes(+s.d)) return null;
    const rolls = Array.isArray(h.rolls) ? h.rolls.map(v => int(v, 0)).filter(v => v >= 1) : [];
    if (!rolls.length) return null;
    return {
      label: h.label.slice(0, 40),
      total: int(h.total, 0),
      nat: h.nat === "nat20" || h.nat === "nat1" ? h.nat : null,
      rolls,
      kept: Array.isArray(h.kept) ? h.kept.map(v => int(v, 0)).filter(i => i >= 0 && i < rolls.length) : rolls.map((_, i) => i),
      spec: { d: +s.d, n: Math.min(20, Math.max(1, int(s.n, 1))),
              mod: Math.min(99, Math.max(-99, int(s.mod, 0))),
              adv: s.adv === "advantage" || s.adv === "disadvantage" ? s.adv : "normal" },
    };
  }
  function vDice(raw){
    const d = { history:[], ui:{ die:20, count:1, mod:0, adv:"normal" } };
    if (!raw || typeof raw !== "object") return d;
    if (Array.isArray(raw.history))
      d.history = raw.history.map(vDiceEntry).filter(Boolean).slice(0, 12);
    const u = raw.ui || {};
    if (DIES.includes(+u.die)) d.ui.die = +u.die;
    d.ui.count = Math.min(20, Math.max(1, int(u.count, 1)));
    d.ui.mod = Math.min(99, Math.max(-99, int(u.mod, 0)));
    if (u.adv === "advantage" || u.adv === "disadvantage") d.ui.adv = u.adv;
    return d;
  }
  function vPresets(raw){
    const out = [];
    for (const p of Array.isArray(raw) ? raw : []){
      if (!p || typeof p !== "object" || typeof p.name !== "string" || !p.name.trim()) continue;
      out.push({ id: typeof p.id === "string" ? p.id : "s" + (out.length + 1),
                 name: p.name.trim().slice(0, 80),
                 savedAt: int(p.savedAt, 0),
                 enc: vEnc(p.enc),
                 dice: vDice(p.dice) });
    }
    return out;
  }
  function vUi(raw){
    // dice panel defaults collapsed on narrow viewports, where it competes
    // with the combatant list for the same height budget
    const u = { mode:"browse", qty:1, viewingId:null,
                diceOpen: !matchMedia("(max-width:760px)").matches,
                colSide: COL_DEF.side, colTrk: COL_DEF.trk,
                side:"monster", catalogTab:"monster", tableTab:"party" };
    if (!raw || typeof raw !== "object") return u;
    if (raw.mode === "track") u.mode = "track";
    u.qty = Math.min(10, Math.max(1, int(raw.qty, 1)));
    if (typeof raw.diceOpen === "boolean") u.diceOpen = raw.diceOpen;
    if (typeof raw.viewingId === "string") u.viewingId = raw.viewingId;
    u.colSide = Math.min(COL_MAX.side, Math.max(COL_MIN.side, int(raw.colSide, COL_DEF.side)));
    u.colTrk = Math.min(COL_MAX.trk, Math.max(COL_MIN.trk, int(raw.colTrk, COL_DEF.trk)));
    if (raw.side === "spell" || raw.side === "party" || raw.side === "enc") u.side = raw.side;
    if (raw.catalogTab === "spell") u.catalogTab = "spell";
    if (raw.tableTab === "enc") u.tableTab = "enc";
    if (u.side === "monster" || u.side === "spell") u.catalogTab = u.side;
    if (u.side === "party" || u.side === "enc") u.tableTab = u.side;
    return u;
  }
  function vPd(raw){
    const p = { showRolls: false, roll: null };
    if (!raw || typeof raw !== "object") return p;
    if (typeof raw.showRolls === "boolean") p.showRolls = raw.showRolls;
    if (raw.roll && typeof raw.roll === "object"){
      const id = int(raw.roll.id, 0);
      if (id){
        p.roll = {
          total: int(raw.roll.total, 0),
          nat: raw.roll.nat === "nat20" || raw.roll.nat === "nat1" ? raw.roll.nat : null,
          id,
        };
      }
    }
    return p;
  }

  /* ---------------- state ---------------- */
  const COL_DEF = { side: 340, trk: 380 };
  const COL_MIN = { side: 200, trk: 260 };
  const COL_MAX = { side: 560, trk: 640 };
  const PANE_MIN = 200;

  const state = {
    enc:     vEnc(load(LS.enc, null)),
    party:   vParty(load(LS.party, null)),
    presets: vPresets(load(LS.presets, null)),
    dice:    vDice(load(LS.dice, null)),
    ui:      vUi(load(LS.ui, null)),
    pd:      vPd(load(LS.pd, null)),
  };

  /* ---------------- shared helpers ---------------- */
  const announce = m => { const el = $("#trklive"); el.textContent = ""; el.textContent = m; };
  const byId = id => state.enc.combatants.find(c => c.id === id);
  const d20 = () => 1 + Math.floor(Math.random() * 20);

  /* Combatant stats from a record. The per-system initiative rule lives here:
     PF2e rolls initiative on Perception; 5e on DEX, except the 2025 SRD which
     prints an explicit modifier (systemExtras.initiative). */
  function initModOf(r){
    if (r.gameSystem === "pf2e") return r.perception?.mod ?? 0;
    return r.systemExtras?.initiative ?? r.abilityMods?.dex ?? 0;
  }
  const acOf = r => r.defenses?.ac?.value ?? null;
  const hpOf = r => r.defenses?.hp?.[0]?.value ?? null;

  /* ---------------- undo ring ---------------- */
  /* mutate() is the single choke point: every encounter change passes through
     it, so undo coverage is structural — reset and preset-load included. */
  const hist = { past: [], future: [] };
  function mutate(fn){
    hist.past.push(JSON.stringify(state.enc));
    if (hist.past.length > 50) hist.past.shift();
    hist.future.length = 0;
    fn(state.enc);
    state.enc = vEnc(state.enc);             // self-heal after every mutation
    save(LS.enc, state.enc);
    renderTrk(); pdPush();
  }
  function undo(){
    if (!hist.past.length) return;
    hist.future.push(JSON.stringify(state.enc));
    state.enc = vEnc(JSON.parse(hist.past.pop()));
    save(LS.enc, state.enc); renderTrk(); pdPush(); announce("Undone");
  }
  function redo(){
    if (!hist.future.length) return;
    hist.past.push(JSON.stringify(state.enc));
    state.enc = vEnc(JSON.parse(hist.future.pop()));
    save(LS.enc, state.enc); renderTrk(); pdPush(); announce("Redone");
  }
  /* ---------------- player display ---------------- */
  /* One renderer, three surfaces: a fullscreen layer on this screen, a child
     window scripted directly from here (same-origin, no sync machinery), and
     a #pd fallback page that polls localStorage — for the file:// cases where
     a blank child window can't be scripted. Never shows an HP number. */
  const PD_MODE = location.hash === "#pd";
  const PD_W = 1920, PD_H = 1080;
  let pw = null;

  function badgeOf(c){
    if (c.type === "player") return null;          // players are never described
    if (c.hp.current === 0) return "Unconscious";
    if (c.hp.current / c.hp.max <= .25) return "Bloody";
    if (c.hp.current < c.hp.max) return "Hurt";
    return null;                                   // healthy carries no badge
  }
  function pdHTML(enc){
    const head = `<div class="pdhead"><span>${esc(enc.name)}</span>` +
                 (enc.round >= 1 ? `<span>Round ${esc(enc.round)}</span>` : "") + `</div>`;
    if (enc.round < 1){
      const pcs = enc.combatants.filter(c => c.type === "player");
      return head + `<div class="pdwait"><span>The GM is preparing the encounter…</span>` +
        (pcs.length ? `<div class="pdpcs">${pcs.map(c => esc(c.name)).join(" · ")}</div>` : "") +
        `</div>`;
    }
    if (!enc.combatants.length)
      return head + `<div class="pdwait"><span>Combat in progress…</span></div>`;
    const rows = enc.combatants.map(c => {
      const b = badgeOf(c);
      return `<div class="pdrow${c.id === enc.activeId ? " on" : ""}${c.hp.current === 0 ? " uncon" : ""}">
        <span class="pdinit">${esc(c.initiative)}</span>
        <span class="pdnm">${esc(c.name)}</span>
        ${b ? `<span class="pdbadge ${b.toLowerCase()}">${b}</span>` : ""}
      </div>`;
    }).join("");
    return head + `<div class="pdrows">${rows}</div>`;
  }
  function pdCSS(){
    const g = t => getComputedStyle(document.documentElement).getPropertyValue(t).trim();
    const ink = g("--ink"), st3 = g("--stone-3"), st2 = g("--stone-2"),
          gilt = g("--gilt"), brick = g("--brick"), faint = g("--faint"),
          sans = g("--sans"), serif = g("--serif"), mono = g("--mono");
    return `
.pdbody{margin:0;height:100vh;background:${ink};overflow:hidden}
.pdroot{height:100%;background:${ink};color:${st3};font-family:${sans};overflow:hidden;
  display:flex;flex-direction:column}
.pdroot .pdhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:14px 22px;border-bottom:1px solid rgba(242,241,237,.16);
  font-family:${serif};font-variant:small-caps;letter-spacing:.05em;font-size:22px;color:${st2}}
.pdroot .pdrows{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:10px 22px;min-height:0}
.pdroot .pdrow{display:flex;align-items:baseline;gap:.55em;
  font-size:var(--pd-fs,30px);line-height:1.35;padding:.1em .35em;
  border-left:.14em solid transparent}
.pdroot .pdrow.on{border-left-color:${gilt};background:rgba(156,124,28,.12)}
.pdroot .pdinit{min-width:1.5em;text-align:right;font-family:${mono};font-weight:700;
  font-variant-numeric:tabular-nums;color:${gilt};font-size:.85em}
.pdroot .pdnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:600}
.pdroot .pdrow.uncon .pdnm{color:${faint}}
.pdroot .pdbadge{flex:none;align-self:center;font-family:${mono};font-size:.34em;
  font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  padding:.45em .8em;border-radius:.25em}
.pdroot .pdbadge.hurt{background:none;border:1px solid ${gilt};color:${st3}}
.pdroot .pdbadge.bloody{background:${brick};color:#FBF6EA}
.pdroot .pdbadge.unconscious{background:none;border:1px solid ${faint};color:${st3}}
.pdroot .pdwait{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.8em;padding:20px;
  font-family:${serif};font-style:italic;font-size:26px;color:${st2};text-align:center}
.pdroot .pdpcs{font-family:${sans};font-style:normal;font-size:20px;color:${st2};opacity:.75}
.pdroot .pdmain{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pdtoast-wrap{
  position:fixed;left:0;right:0;bottom:0;pointer-events:none;z-index:5;
  display:flex;justify-content:center;padding:20px 18px 28px}
.pdtoast{
  padding:.28em .55em;border-radius:.15em;
  font-family:${mono};font-weight:700;font-size:clamp(52px,14vw,128px);
  font-variant-numeric:tabular-nums;line-height:1;
  background:rgba(36,33,28,.9);color:${st3};
  border:2px solid rgba(242,241,237,.22);
  transform:translateY(115%);opacity:0;
  transition:transform .32s ease-out,opacity .32s ease-out}
.pdtoast.show{transform:translateY(0);opacity:1}
.pdtoast.nat20{color:#FBF6EA;background:${g("--olive")};border-color:rgba(242,241,237,.35)}
.pdtoast.nat1{color:#FBF6EA;background:${brick};border-color:rgba(242,241,237,.35)}
.pddead{position:fixed;left:0;right:0;bottom:0;padding:10px;text-align:center;
  background:${brick};color:#FBF6EA;font:600 14px ${sans}}`;
  }
  function ensurePdStyle(doc){
    if (doc.getElementById("pdstyle")) return;
    const s = doc.createElement("style");
    s.id = "pdstyle"; s.textContent = pdCSS();
    doc.head.appendChild(s);
  }
  /* the old tracker's best idea: scale type to fill the screen from the
     combatant count, so a 4-row board and a 12-row board both fill a TV */
  function scalePd(main, h){
    if (!main) return;
    h = h || PD_H;
    const rows = main.querySelectorAll(".pdrow").length;
    const head = main.querySelector(".pdhead");
    const n = Math.max(4, rows);
    const fs = Math.max(22, Math.min(84, (h - (head ? head.offsetHeight : 0) - 32) / n / 1.55));
    main.style.setProperty("--pd-fs", fs.toFixed(1) + "px");
  }
  function ensurePdLayout(root, boardHTML){
    let main = root.querySelector(".pdmain");
    if (!main){
      root.innerHTML = `<div class="pdmain">${boardHTML}</div><div class="pdtoast-wrap"></div>`;
      return root.querySelector(".pdmain");
    }
    main.innerHTML = boardHTML;
    return main;
  }
  function flashPdToast(wrap, roll){
    if (!wrap || !roll) return;
    if (wrap.dataset.lastRoll === String(roll.id)) return;
    wrap.dataset.lastRoll = String(roll.id);
    clearTimeout(wrap._t);
    const nat = roll.nat === "nat20" ? " nat20" : roll.nat === "nat1" ? " nat1" : "";
    const el = document.createElement("div");
    el.className = "pdtoast" + nat;
    el.textContent = String(roll.total);
    wrap.replaceChildren(el);
    requestAnimationFrame(() => el.classList.add("show"));
    wrap._t = setTimeout(() => {
      el.classList.remove("show");
      setTimeout(() => { if (wrap.firstChild === el) wrap.replaceChildren(); }, 360);
    }, 3200);
  }
  function pdApplyRoll(root){
    if (!root || !state.pd.showRolls || !state.pd.roll) return;
    flashPdToast(root.querySelector(".pdtoast-wrap"), state.pd.roll);
  }
  function broadcastPdRoll(entry){
    if (!state.pd.showRolls) return;
    state.pd.roll = { total: entry.total, nat: entry.nat, id: Date.now() };
    save(LS.pd, state.pd);
    pdPushRoll();
  }
  function pdPushRoll(){
    if (PD_MODE) return;
    if (pw && !pw.closed){
      try{
        const root = pw.document.getElementById("pdroot");
        if (root) pdApplyRoll(root);
      }catch(_){}
    }
  }
  function setPdShowRolls(on){
    state.pd.showRolls = !!on;
    save(LS.pd, state.pd);
    renderPdRollToggle();
  }
  function renderPdRollToggle(){
    const el = $("#pd-showrolls");
    if (el) el.checked = state.pd.showRolls;
  }
  function pdPush(){
    const board = pdHTML(state.enc);
    if (pw && !pw.closed){
      try{
        const root = pw.document.getElementById("pdroot");
        if (root){
          const main = ensurePdLayout(root, board);
          scalePd(main, pw.innerHeight || PD_H);
          pdApplyRoll(root);
        }
      }catch(_){ /* unscriptable child (file://) — it runs the #pd fallback */ }
    }
  }
  function openPdWindow(){
    if (pw && !pw.closed){
      pw.focus();
      pdPush();
      announce("Player display focused");
      return;
    }
    const left = Math.max(0, Math.round((screen.width - PD_W) / 2));
    const top = Math.max(0, Math.round((screen.height - PD_H) / 2));
    try{
      pw = window.open("", "bgpd",
        `popup=yes,width=${PD_W},height=${PD_H},left=${left},top=${top}`);
    }catch(_){ pw = null; }
    if (!pw){ announce("Pop-up blocked — allow pop-ups for this page"); return; }
    let scripted = false;
    try{
      pw.document.open();
      pw.document.write(`<!doctype html><html><head><meta charset="utf-8">` +
        `<meta name="viewport" content="width=${PD_W},height=${PD_H}">` +
        `<title>${esc(state.enc.name)} — Initiative</title>` +
        `<style>${pdCSS()}</style></head><body class="pdbody">` +
        `<div id="pdroot" class="pdroot"></div>` +
        `<div id="pddead" class="pddead" hidden>Display disconnected — reopen it from the GM window</div>` +
        `<scr` + `ipt>setInterval(function(){try{if(!window.opener||window.opener.closed)` +
        `document.getElementById("pddead").hidden=false}catch(e){` +
        `document.getElementById("pddead").hidden=false}},2000)</scr` + `ipt></body></html>`);
      pw.document.close();
      scripted = true;
    }catch(_){ scripted = false; }
    if (!scripted){
      try{ pw.location.href = location.href.split("#")[0] + "#pd"; }catch(_){ pw = null; }
      return;
    }
    try{ pw.addEventListener("resize", pdPush); }catch(_){}
    pdPush();
    announce("Player display opened");
  }

  /* ---------------- naming ---------------- */
  /* "Goblin", then another goblin: the first retroactively becomes "Goblin 1"
     and numbering continues from the highest existing number. */
  function autoName(e, base, want){
    const rx = new RegExp("^" + base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "( (\\d+))?$");
    let plain = null; const nums = [];
    for (const c of e.combatants){
      const m = c.name.match(rx);
      if (!m) continue;
      if (m[2] == null) plain = c; else nums.push(+m[2]);
    }
    if (!plain && !nums.length && want === 1) return [base];
    if (plain){ plain.name = base + " 1"; nums.push(1); }
    let n = nums.length ? Math.max(...nums) : 0;
    return Array.from({length: want}, () => base + " " + (++n));
  }

  /* ---------------- actions ---------------- */
  const sortEnc = e => e.combatants.sort((a,b) => b.initiative - a.initiative); // stable: ties keep order
  function addMany(spec, count){
    const n = Math.min(10, Math.max(1, int(count, 1)));
    mutate(e => {
      const names = autoName(e, spec.name, n);
      for (const nm of names){
        const mid = e.round >= 1 && spec.type !== "player";   // mid-combat adds roll in
        e.combatants.push({
          id: "c" + (++e.seq), name: nm, type: spec.type,
          initiative: mid ? d20() + spec.mod : 0,
          initiativeModifier: spec.mod,
          ac: spec.ac, hp: { current: spec.hpMax, max: spec.hpMax },
          status: "normal", ref: spec.ref ?? null, sys: spec.sys ?? null,
        });
      }
      if (e.round >= 1) sortEnc(e);
    });
    announce(n === 1 ? spec.name + " added" : spec.name + " ×" + n + " added");
  }
  function addFromView(i){
    const r = view[i];
    if (!r || r._kind !== "monster") return;
    const hp = hpOf(r);
    if (hp == null){                 // ~95 PF2e hazard-like records: never fabricate HP
      openAddForm({ name: r.name, type: "monster", mod: initModOf(r),
                    ac: acOf(r), ref: r.id, sys: r.gameSystem });
      return;
    }
    addMany({ name: r.name, type: "monster", hpMax: hp, ac: acOf(r),
              mod: initModOf(r), ref: r.id, sys: r.gameSystem }, state.ui.qty);
  }
  function removeCombatant(id){
    mutate(e => {
      const i = e.combatants.findIndex(c => c.id === id);
      if (i < 0) return;
      const wasActive = e.activeId === id;
      const nm = e.combatants[i].name;
      e.combatants.splice(i, 1);
      if (wasActive)                             // positional repair, not a turn
        e.activeId = e.combatants.length
          ? e.combatants[Math.min(i, e.combatants.length - 1)].id : null;
      announce(nm + " removed");
    });
  }
  function applyHP(id, amount, kind){
    const amt = Math.abs(int(amount, 0));
    if (!amt) return false;
    mutate(e => {
      const c = e.combatants.find(x => x.id === id);
      if (!c) return;
      c.hp.current = Math.min(c.hp.max, Math.max(0, c.hp.current + (kind === "heal" ? amt : -amt)));
      e.last = { kind: kind === "heal" ? "heal" : "dmg" };
      announce(c.name + (kind === "heal" ? " healed to " : " damaged to ") + c.hp.current + " HP");
    });
    return true;
  }

  /* ---------------- combat flow ---------------- */
  function startCombat(map){                  // map: combatant id -> initiative
    mutate(e => {
      for (const c of e.combatants) if (map.has(c.id)) c.initiative = map.get(c.id);
      sortEnc(e);
      e.round = 1;
      e.activeId = e.combatants[0]?.id ?? null;
    });
  }
  function endCombat(){                        // back to setup; combatants and HP kept
    mutate(e => { e.round = 0; e.activeId = null; });
    announce("Combat ended");
  }
  function canPrev(){
    const e = state.enc;
    if (e.round < 1 || !e.combatants.length) return false;
    const i = e.combatants.findIndex(c => c.id === e.activeId);
    return !(i <= 0 && e.round === 1);        // can't step before combat start
  }
  function nextTurn(){
    const e = state.enc;
    if (e.round < 1 || !e.combatants.length) return;
    mutate(x => {
      const i = x.combatants.findIndex(c => c.id === x.activeId);
      const n = i + 1;
      if (n >= x.combatants.length){ x.activeId = x.combatants[0].id; x.round++; }
      else x.activeId = x.combatants[n].id;
    });
    afterTurn();
  }
  function prevTurn(){
    if (!canPrev()) return;                   // checked BEFORE mutate: no-ops don't pollute undo
    mutate(x => {
      const i = x.combatants.findIndex(c => c.id === x.activeId);
      if (i <= 0){ x.round--; x.activeId = x.combatants[x.combatants.length - 1].id; }
      else x.activeId = x.combatants[i - 1].id;
    });
    afterTurn();
  }
  function afterTurn(){
    const c = byId(state.enc.activeId);
    if (c) announce("Round " + state.enc.round + " — " + c.name + "'s turn");
    scrollActive();
  }
  function scrollActive(){
    const el = $("#trklist").querySelector(".cbt.on");
    if (el) el.scrollIntoView({ block: "nearest" });
  }
  function resetEnc(){                         // keep players, drop the rest
    mutate(e => {
      e.combatants = e.combatants.filter(c => c.type === "player");
      e.combatants.forEach(c => { c.initiative = 0; });
      e.round = 0; e.activeId = null;
    });
    announce("Encounter reset — players kept");
  }
  function clearAll(){
    mutate(e => { e.combatants = []; e.round = 0; e.activeId = null; });
    announce("Encounter cleared");
  }

  /* ---------------- initiative editing & reorder ---------------- */
  function setInitiative(id, v){
    mutate(e => {
      const c = e.combatants.find(x => x.id === id);
      if (c) c.initiative = v;
      sortEnc(e);                              // stable: manual tie arrangement survives
    });
  }
  /* integer midpoint: the dragged combatant takes floor-ish middle ground;
     at the edges it goes one above the top or one below the bottom */
  function midInit(arr, i){
    const above = i > 0 ? arr[i - 1].initiative : null;
    const below = i < arr.length - 1 ? arr[i + 1].initiative : null;
    if (above == null && below == null) return arr[i].initiative;
    if (above == null) return below + 1;
    if (below == null) return above - 1;
    return Math.round((above + below) / 2);
  }
  function reorderTo(id, beforeId){            // drop ON a card = take its slot
    if (id === beforeId) return;
    mutate(e => {
      const from = e.combatants.findIndex(c => c.id === id);
      if (from < 0) return;
      const [c] = e.combatants.splice(from, 1);
      let to = beforeId ? e.combatants.findIndex(x => x.id === beforeId) : e.combatants.length;
      if (to < 0) to = e.combatants.length;
      e.combatants.splice(to, 0, c);
      if (e.round >= 1) c.initiative = midInit(e.combatants, to);
    });
  }
  function canMove(id, delta){
    const e = state.enc;
    const i = e.combatants.findIndex(c => c.id === id);
    const j = i + delta;
    return i >= 0 && j >= 0 && j < e.combatants.length;
  }
  function moveBy(id, delta){
    if (!canMove(id, delta)) return;
    mutate(e => {
      const i = e.combatants.findIndex(c => c.id === id);
      const [c] = e.combatants.splice(i, 1);
      e.combatants.splice(i + delta, 0, c);
      if (e.round >= 1) c.initiative = midInit(e.combatants, i + delta);
    });
  }
  function editInit(span){
    const card = span.closest(".cbt");
    const c = byId(card.dataset.id);
    if (!c) return;
    const inp = document.createElement("input");
    inp.type = "number"; inp.className = "cbt-init-edit";
    inp.min = "-10"; inp.max = "50";
    inp.value = c.initiative === 0 ? "" : c.initiative;
    inp.setAttribute("aria-label", "Initiative for " + c.name);
    span.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const commit = ok => {
      if (done) return; done = true;
      const v = inp.value.trim();
      if (ok && v !== "" && Number.isFinite(+v) && Math.round(+v) !== c.initiative)
        setInitiative(c.id, Math.round(+v));
      else renderTrk();                        // restore without polluting undo
    };
    inp.onblur = () => commit(true);
    inp.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); commit(true); }
      else if (e.key === "Escape"){ e.stopPropagation(); commit(false); }
    };
  }
  function editName(){
    const span = $("#trkname");
    const inp = document.createElement("input");
    inp.className = "trkname-edit"; inp.maxLength = 80;
    inp.value = state.enc.name;
    inp.setAttribute("aria-label", "Encounter name");
    span.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const commit = ok => {
      if (done) return; done = true;
      const v = inp.value.trim();
      inp.replaceWith(span);                  // restore BEFORE render so #trkname resolves
      if (ok && v && v !== state.enc.name) mutate(e => { e.name = v; });
      span.focus();
    };
    inp.onblur = () => commit(true);
    inp.onkeydown = e => {
      if (e.key === "Enter"){ e.preventDefault(); commit(true); }
      else if (e.key === "Escape"){ e.stopPropagation(); commit(false); }
    };
  }

  /* ---------------- start-combat modal ---------------- */
  function startInitRow(c){
    const preset = c.initiative !== 0;
    const r = preset ? (c.initiative - c.initiativeModifier) : d20();
    const tot = r + c.initiativeModifier;
    const modSign = c.initiativeModifier >= 0 ? "+" : "−";
    const modAbs = Math.abs(c.initiativeModifier);
    const brk = `d20 ${r} ${modSign} ${modAbs}`;
    if (c.type === "player")
      return `<div class="srow" data-id="${c.id}" data-roll="${r}">
        <span class="srnm">${esc(c.name)}</span>
        <span class="sbreak">${esc(brk)}</span>
        <input type="number" class="sinit" min="-5" max="45" value="${tot}"
               aria-label="Initiative for ${esc(c.name)}">
        <button type="button" class="chip sre" aria-label="Reroll for ${esc(c.name)}">↻</button>
      </div>`;
    return `<div class="srow" data-id="${c.id}" data-roll="${r}">
      <span class="srnm">${esc(c.name)}</span>
      <span class="sbreak">${esc(brk)}</span>
      <span class="stot">${tot}</span>
      <button type="button" class="chip sre" aria-label="Reroll for ${esc(c.name)}">↻</button>
    </div>`;
  }
  function openStartModal(){
    const e = state.enc;
    if (!e.combatants.length) return;
    const rows = e.combatants.map(c => startInitRow(c)).join("");
    openOvl(`<form id="startform" novalidate>
      <h3>Roll initiative</h3>
      <div class="warn" id="sf-warn" hidden></div>
      <div class="srows">${rows}</div>
      <div class="btns">
        <button type="button" class="chip" data-close>Cancel</button>
        <button type="submit" class="chip yes">Begin combat</button>
      </div>
    </form>`);
    const form = $("#startform");
    form.querySelector("[data-close]").onclick = closeOvl;
    form.addEventListener("click", ev => {
      const b = ev.target.closest(".sre"); if (!b) return;
      const row = b.closest(".srow");
      const c = byId(row.dataset.id);
      const r = d20();
      const tot = r + c.initiativeModifier;
      row.dataset.roll = r;
      row.querySelector(".sbreak").textContent =
        `d20 ${r} ${c.initiativeModifier >= 0 ? "+" : "−"} ${Math.abs(c.initiativeModifier)}`;
      const inp = row.querySelector(".sinit");
      if (inp) inp.value = tot;
      else row.querySelector(".stot").textContent = tot;
    });
    form.onsubmit = ev => {
      ev.preventDefault();
      const map = new Map(); const missing = [];
      form.querySelectorAll(".srow").forEach(row => {
        const c = byId(row.dataset.id); if (!c) return;
        const inp = row.querySelector(".sinit");
        if (inp){
          const v = inp.value.trim();
          if (v === "" || !Number.isFinite(+v)){
            missing.push(c.name); inp.setAttribute("aria-invalid", "true");
          } else {
            inp.setAttribute("aria-invalid", "false");
            map.set(c.id, Math.round(+v));
          }
        } else map.set(c.id, +row.dataset.roll + c.initiativeModifier);
      });
      const w = $("#sf-warn");
      if (missing.length){                     // visible, never silent
        w.hidden = false;
        w.textContent = "Enter initiative for: " + missing.join(", ");
        form.querySelector('.sinit[aria-invalid="true"]').focus();
        return;
      }
      startCombat(map);
      closeOvl();
      const first = byId(state.enc.activeId);
      announce("Combat started — " + (first ? first.name + " acts first" : ""));
      scrollActive();
    };
  }

  function hpClass(c){

  function cardHTML(c){

  /* ---------------- inline confirm (never window.confirm) ---------------- */
  /* Yes restores the trigger first, then runs the action — otherwise the
     confirm hangs in the toolbar because Reset/Clear/End never rebuild it. */
  function confirmSwap(btn, label, onYes){
    const host = document.createElement("span");
    host.className = "cfm";
    host.innerHTML = `<span>${esc(label)}</span>` +
      `<button type="button" class="chip yes">Yes</button>` +
      `<button type="button" class="chip">No</button>`;
    const [yes, no] = host.querySelectorAll("button");
    let done = false;
    const t = setTimeout(revert, 5000);
    function revert(){
      if (done) return;
      done = true;
      clearTimeout(t);
      if (host.isConnected) host.replaceWith(btn);
      if (btn.isConnected) btn.focus();
    }
    yes.onclick = () => { revert(); onYes(); };
    no.onclick = revert;
    host.addEventListener("keydown", e => {
      if (e.key === "Escape"){ e.stopPropagation(); revert(); } });
    btn.replaceWith(host);
    yes.focus();
  }

  /* ---------------- overlay ---------------- */
  let ovlReturn = null;
  function openOvl(html){
    ovlReturn = document.activeElement;
    const o = $("#trkovl");
    o.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;
    const dlg = o.querySelector(".dlg");
    const title = dlg && dlg.querySelector("h3");
    if (title){
      title.id = "ovl-title";
      dlg.setAttribute("aria-labelledby", "ovl-title");
    }
    o.hidden = false;
    if (window.setAppInert) setAppInert(true);
    o.onclick = e => { if (e.target === o) closeOvl(); };
    const f = o.querySelector("input,select,textarea,button");
    if (f) f.focus();
  }
  function closeOvl(){
    const o = $("#trkovl");
    if (o.hidden) return;
    o.hidden = true; o.innerHTML = ""; o.onclick = null;
    if (window.setAppInert) setAppInert(false);
    if (ovlReturn && ovlReturn.isConnected) ovlReturn.focus();
    ovlReturn = null;
  }

  /* ---------------- add form ---------------- */
  function openAddForm(pre = {}){
    const opts = n => Array.from({length: 10}, (_, i) =>
      `<option${i + 1 === n ? " selected" : ""}>${i + 1}</option>`).join("");
    openOvl(`<form id="addform" novalidate>
      <h3>Add combatant</h3>
      <div class="warn" id="af-warn" hidden></div>
      <label>Name <input name="name" maxlength="80" value="${esc(pre.name ?? "")}"></label>
      <label>Type <select name="type">
        <option value="player"${!pre.type || pre.type === "player" ? " selected" : ""}>Player</option>
        <option value="npc"${pre.type === "npc" ? " selected" : ""}>NPC</option>
        <option value="monster"${pre.type === "monster" ? " selected" : ""}>Monster</option>
      </select></label>
      <div class="row2">
        <label>Max HP <input name="hp" type="number" min="1" max="99999" value="${pre.hpMax ?? ""}"></label>
        <label>AC <input name="ac" type="number" min="0" max="99" value="${pre.ac ?? ""}"></label>
      </div>
      <div class="row2">
        <label>Initiative modifier <input name="mod" type="number" min="-10" max="50" value="${esc(pre.mod ?? 0)}"></label>
        <label>Count <select name="count">${opts(pre.ref ? 1 : state.ui.qty)}</select></label>
      </div>
      <div class="btns">
        <button type="button" class="chip" data-close>Cancel</button>
        <button type="submit" class="chip yes">Add</button>
      </div>
    </form>`);
    const form = $("#addform");
    form.dataset.ref = pre.ref ?? ""; form.dataset.sys = pre.sys ?? "";
    form.querySelector("[data-close]").onclick = closeOvl;
    form.onsubmit = ev => {
      ev.preventDefault();
      const fd = new FormData(form);
      const name = String(fd.get("name") || "").trim();
      const hp = int(fd.get("hp"), 0);
      const errs = [];
      if (!name) errs.push("a name");
      if (hp < 1) errs.push("max HP");
      form.querySelector("[name=name]").setAttribute("aria-invalid", String(!name));
      form.querySelector("[name=hp]").setAttribute("aria-invalid", String(hp < 1));
      const w = $("#af-warn");
      if (errs.length){                        // visible validation, never silent
        w.hidden = false;
        w.textContent = "Enter " + errs.join(" and ") + ".";
        form.querySelector(errs[0] === "a name" ? "[name=name]" : "[name=hp]").focus();
        return;
      }
      const acRaw = String(fd.get("ac") ?? "").trim();
      addMany({ name, type: String(fd.get("type")), hpMax: hp,
                ac: acRaw === "" ? null : int(acRaw, null),
                mod: Math.min(50, Math.max(-10, int(fd.get("mod"), 0))),
                ref: form.dataset.ref || null, sys: form.dataset.sys || null },
              int(fd.get("count"), 1));
      closeOvl();
    };
  }

  /* ---------------- party library ---------------- */
  function partyRowsHTML(){
    if (!state.party.length)
      return `<div class="pempty">No saved party members yet.</div>`;
    return state.party.map(p => {
      const meta = [p.type, p.hpMax != null ? p.hpMax + " HP" : "HP ?",
                    p.ac != null ? "AC " + p.ac : null,
                    (p.mod >= 0 ? "+" : "") + p.mod].filter(Boolean).join(" · ");
      return `<div class="prow" data-id="${esc(p.id)}">

  function openPartyOvl(editId){
    const isNew = editId === "__new__";
    const editing = editId && !isNew ? state.party.find(p => p.id === editId) : null;
    const showForm = isNew || !!editing;
    openOvl(`<h3>Party</h3>
      <div class="warn" id="pf-warn" hidden></div>
      <div class="plist" ${showForm ? "hidden" : ""}>${partyRowsHTML()}</div>

        <label>Type <select name="type">
          <option value="player"${!editing || editing.type === "player" ? " selected" : ""}>Player</option>
          <option value="npc"${editing?.type === "npc" ? " selected" : ""}>NPC</option>
        </select></label>
        <div class="row2">
          <label>Max HP <input name="hp" type="number" min="1" max="99999" value="${editing?.hpMax ?? ""}"></label>
          <label>AC <input name="ac" type="number" min="0" max="99" value="${editing?.ac ?? ""}"></label>
        </div>
        <label>Initiative modifier <input name="mod" type="number" min="-10" max="50" value="${esc(editing?.mod ?? 0)}"></label>
        <div class="btns">
          <button type="button" class="chip" data-cancel>Back</button>
          <button type="submit" class="chip yes">${editing ? "Save" : "Add member"}</button>
        </div>
      </form>
      <div class="btns" id="pfoot" ${showForm ? "hidden" : ""}>
        <button type="button" class="chip" data-new>New member</button>
        <button type="button" class="chip" data-close>Close</button>
      </div>`);
    const o = $("#trkovl");
    o.querySelector("[data-close]")?.addEventListener("click", closeOvl);
    o.querySelector("[data-new]")?.addEventListener("click", () => openPartyOvl("__new__"));
    o.querySelector("[data-cancel]")?.addEventListener("click", () => openPartyOvl());
    o.querySelector(".plist")?.addEventListener("click", e => {
      const row = e.target.closest(".prow"); if (!row) return;
      const p = state.party.find(x => x.id === row.dataset.id); if (!p) return;
      if (e.target.closest("[data-padd]")){
        if (p.hpMax == null){ openAddForm({ name: p.name, type: p.type, ac: p.ac, mod: p.mod }); return; }
        // a player is one person; NPCs multiply with the quantity control
        addMany({ name: p.name, type: p.type, hpMax: p.hpMax, ac: p.ac, mod: p.mod,
                  ref: null, sys: null }, p.type === "player" ? 1 : state.ui.qty);
      } else if (e.target.closest("[data-pedit]")){
        openPartyOvl(p.id);
      } else if (e.target.closest("[data-pdel]")){
        confirmSwap(e.target.closest("[data-pdel]"), "Delete " + p.name + "?", () => {
          state.party = state.party.filter(x => x.id !== p.id);
          save(LS.party, state.party);
          openPartyOvl();
          if (window.refresh) refresh();
        });
      }
    });
    const form = o.querySelector("#pform");
    if (form) form.onsubmit = ev => {
      ev.preventDefault();
      const fd = new FormData(form);
      const name = String(fd.get("name") || "").trim();
      const hp = int(fd.get("hp"), 0);
      const w = $("#pf-warn");
      if (!name || hp < 1){
        w.hidden = false;
        w.textContent = "Enter " + [!name && "a name", hp < 1 && "max HP"].filter(Boolean).join(" and ") + ".";
        return;
      }
      if (!editing && state.party.length >= 100){
        w.hidden = false; w.textContent = "Party is full (100)."; return;
      }
      const acRaw = String(fd.get("ac") ?? "").trim();
      const m = { id: editing ? editing.id : "p" + Date.now().toString(36),
                  name, type: String(fd.get("type")) === "npc" ? "npc" : "player",
                  hpMax: hp, ac: acRaw === "" ? null : int(acRaw, null),
                  mod: Math.min(50, Math.max(-10, int(fd.get("mod"), 0))) };
      if (editing) state.party = state.party.map(x => x.id === editing.id ? m : x);
      else state.party.push(m);
      save(LS.party, state.party);
      openPartyOvl();
      if (window.refresh) refresh();
    };
    if (showForm){
      const inp = o.querySelector("#pform [name=name]");
      if (inp) inp.focus();
    }
  }

  /* ---------------- encounter presets ---------------- */

    return state.presets.map(p => {
      const meta = p.enc.combatants.length + " combatants · " +

      return `<div class="prow" data-id="${esc(p.id)}">

  function savePreset(name){
    const existing = state.presets.find(p => p.name.toLowerCase() === name.toLowerCase());
    const snap = { id: existing ? existing.id : "s" + Date.now().toString(36),
                   name, savedAt: Date.now(),
                   enc: JSON.parse(JSON.stringify(state.enc)),
                   dice: JSON.parse(JSON.stringify(state.dice)) };
    if (existing) state.presets = state.presets.map(p => p.id === existing.id ? snap : p);
    else state.presets.push(snap);
    save(LS.presets, state.presets);
    return !existing;
  }
  function loadPreset(id){
    const p = state.presets.find(x => x.id === id);
    if (!p) return;
    mutate(e => { Object.assign(e, vEnc(p.enc)); });   // undoable, like everything
    state.dice = vDice(p.dice);
    save(LS.dice, state.dice);
    renderDice();
    announce("Loaded " + p.name);
  }

  function renderSideList(q){

    }).join("");
    L.querySelectorAll(".item[data-id]").forEach(el => {
      el.onclick = e => {
        if (e.target.closest("button")) return;
        L.querySelectorAll(".item").forEach(x => {
          x.classList.toggle("sel", x === el);
          x.setAttribute("aria-selected", String(x === el));
        });

  /* ---------------- dice ---------------- */
  /* Advantage forces exactly two dice and keeps the high one (low for
     disadvantage); the unused die is kept in the entry so the display can
     strike it through. Nat 20/1 only means something on a single kept d20. */
  function rollDice(spec){
    const d = DIES.includes(+spec.d) ? +spec.d : 20;
    const adv = spec.adv === "advantage" || spec.adv === "disadvantage" ? spec.adv : "normal";
    const n = adv !== "normal" ? 2 : Math.min(20, Math.max(1, int(spec.n, 1)));
    const mod = Math.min(99, Math.max(-99, int(spec.mod, 0)));
    const rolls = Array.from({length: n}, () => 1 + Math.floor(Math.random() * d));
    let kept = rolls.map((_, i) => i);
    if (adv !== "normal"){
      const pick = adv === "advantage" ? Math.max(...rolls) : Math.min(...rolls);
      kept = [rolls.indexOf(pick)];
    }
    const total = kept.reduce((a, i) => a + rolls[i], 0) + mod;
    const nat = d === 20 && kept.length === 1
      ? (rolls[kept[0]] === 20 ? "nat20" : rolls[kept[0]] === 1 ? "nat1" : null) : null;
    const label = (adv !== "normal" ? "d" + d + (adv === "advantage" ? " Adv" : " Dis") : n + "d" + d)
                + (mod ? (mod > 0 ? "+" + mod : String(mod)) : "");
    return { label, total, nat, rolls, kept, spec: { d, n: int(spec.n, 1), mod, adv } };
  }
  function doRoll(spec){
    const entry = rollDice(spec);
    state.dice.history.unshift(entry);
    if (state.dice.history.length > 12) state.dice.history.length = 12;
    save(LS.dice, state.dice);
    renderDice();
    broadcastPdRoll(entry);
    return entry;
  }
  function breakdownHTML(h){
    const dice = h.rolls.map((v, i) =>
      h.kept.includes(i) ? esc(v) : "<s>" + esc(v) + "</s>").join(", ");
    const m = h.spec.mod ? " " + (h.spec.mod > 0 ? "+" : "−") + Math.abs(h.spec.mod) : "";
    const natTx = h.nat === "nat20" ? ' <span class="nat20">nat 20</span>'
                : h.nat === "nat1" ? ' <span class="nat1">nat 1</span>' : "";
    return `${esc(h.label)} → ${dice}${m} = <b>${esc(h.total)}</b>${natTx}`;
  }
  function renderDice(){
    const u = state.dice.ui;

    document.querySelectorAll("#dice [data-adv]").forEach(b => {

    });
    $("#dcount").value = String(u.count);

    $("#dmod").value = String(u.mod);
    const h = state.dice.history;
    $("#dres").innerHTML = h.length ? breakdownHTML(h[0]) : "";
    $("#dlast").hidden = !h.length;
    $("#dlast").textContent = h.length ? h[0].total : "";
    $("#dhist").innerHTML = h.map((x, i) =>
      `<div class="drow">
         <button type="button" class="chip dre" data-i="${i}" aria-label="Reroll ${esc(x.label)}">↻</button>
         <span class="lbl">${esc(x.label)}</span>
         ${x.nat ? `<span class="${x.nat}">${x.nat === "nat20" ? "nat 20" : "nat 1"}</span>` : ""}
         <b>${esc(x.total)}</b>
       </div>`).join("") +
      (h.length ? `<button type="button" class="chip" id="d-clear">Clear history</button>` : "");

  /* ---------------- keyboard ---------------- */
  function key(e){
    if (e.key === "Escape" && !$("#dpop").hidden){ hideDpop(); return true; }
    const o = $("#trkovl");
    if (!o.hidden){                           // dialog is modal to shortcuts
      if (e.key === "Escape"){ closeOvl(); return true; }
      if (e.key === "Tab"){
        const f = [...o.querySelectorAll("input,select,textarea,button")].filter(x => !x.disabled);
        if (f.length){
          if (!e.shiftKey && document.activeElement === f[f.length - 1]){ e.preventDefault(); f[0].focus(); }
          else if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f[f.length - 1].focus(); }
        }
      }
      return true;                            // native typing unaffected; app shortcuts swallowed
    }
    if (e.key === "Escape" && $("#spellpeek") && !$("#spellpeek").hidden){
      closeSpellPeek(); return true;
    }
    const t = e.target;
    if (t && t.closest && (t.closest("input,textarea,select") || t.isContentEditable)) return false;
    if (state.ui.mode !== "track") return false;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === "z" && !e.shiftKey){ e.preventDefault(); undo(); return true; }
    if (mod && (k === "y" || (k === "z" && e.shiftKey))){ e.preventDefault(); redo(); return true; }
    if (e.key === " "){
      // native activation wins when a control is focused
      if (t && t.closest && t.closest("button,summary,a,[role=button]")) return false;
      if (state.enc.round >= 1){ e.preventDefault(); nextTurn(); return true; }
      return false;
    }
    // arrows inside the tracker column must not drive the picker
    if ((e.key === "ArrowUp" || e.key === "ArrowDown") && t && t.closest && t.closest("#trk"))
      return true;                             // Alt+Arrow reorder already ran at the element
    return false;
  }

  /* ---------------- mode ---------------- */
  function colBudget(which){
    const main = document.querySelector("main");
    if (!main) return COL_MAX[which];
    const handles = document.body.classList.contains("trk") ? 12 : 6;
    const other = which === "side"
      ? (document.body.classList.contains("trk") ? state.ui.colTrk : 0)
      : state.ui.colSide;
    return Math.max(COL_MIN[which], main.clientWidth - other - PANE_MIN - handles);
  }
  function applyColWidths(){
    document.documentElement.style.setProperty("--col-side", state.ui.colSide + "px");
    document.documentElement.style.setProperty("--col-trk", state.ui.colTrk + "px");
  }
  function bindColResize(el, key, which, cssVar){
    if (!el) return;
    el.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const startX = e.clientX, startW = state.ui[key];
      el.classList.add("dragging");
      document.body.classList.add("col-resizing");
      const move = e2 => {
        const w = Math.min(colBudget(which), COL_MAX[which],
          Math.max(COL_MIN[which], startW + (e2.clientX - startX)));
        state.ui[key] = w;
        document.documentElement.style.setProperty(cssVar, w + "px");
      };
      const up = () => {
        el.classList.remove("dragging");
        document.body.classList.remove("col-resizing");
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
        save(LS.ui, state.ui);
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
  }

  // drag reorder (handle-only; keyboard parity is Alt+Arrow above)
  // Indicator is a gap line at the insertion point, not a highlight on the
  // hovered card: pointer in the top half of a card = insert before it,
  // bottom half = insert after it. Drop uses the same slot the line shows.
  let dragId = null, dropSlot = null;          // { card, where: "before"|"after" }
  function clearDropSlot(){
    $("#trklist").querySelectorAll(".drop-before,.drop-after").forEach(el => {
      el.classList.remove("drop-before", "drop-after");
    });
    dropSlot = null;
  }
  function beforeIdOf(slot){
    if (!slot) return null;
    if (slot.where === "before") return slot.card.dataset.id;
    let n = slot.card.nextElementSibling;
    while (n && !n.classList.contains("cbt")) n = n.nextElementSibling;
    return n ? n.dataset.id : null;
  }
  function isNoOpDrop(beforeId){
    const cards = [...$("#trklist").querySelectorAll(".cbt")];
    const from = cards.findIndex(el => el.dataset.id === dragId);
    if (from < 0) return true;
    if (beforeId === dragId) return true;
    const next = cards[from + 1];
    if (next && next.dataset.id === beforeId) return true;
    if (!beforeId && from === cards.length - 1) return true;
    return false;
  }
  function insertionFromY(clientY){
    const cards = [...$("#trklist").querySelectorAll(".cbt")];
    if (!cards.length) return null;
    for (const card of cards){
      if (card.dataset.id === dragId) continue;
      const r = card.getBoundingClientRect();
      if (clientY < r.top + r.height / 2) return { card, where: "before" };
    }
    const last = cards.filter(c => c.dataset.id !== dragId).pop() || cards[cards.length - 1];
    return { card: last, where: "after" };
  }
  function markDropSlot(slot){
    const beforeId = beforeIdOf(slot);
    if (!slot || isNoOpDrop(beforeId)){ clearDropSlot(); return; }
    if (dropSlot && dropSlot.card === slot.card && dropSlot.where === slot.where) return;
    clearDropSlot();
    slot.card.classList.add(slot.where === "before" ? "drop-before" : "drop-after");
    dropSlot = slot;
  }
  $("#trklist").addEventListener("dragstart", e => {
    const handle = e.target.closest(".cbt-drag");
    if (!handle){ e.preventDefault(); return; }
    const card = handle.closest(".cbt");

    dragId = card.dataset.id;
    e.dataTransfer.setData("text/plain", dragId);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("drag");
  });
  $("#trklist").addEventListener("dragover", e => {
    if (!dragId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    markDropSlot(insertionFromY(e.clientY));
  });
  $("#trklist").addEventListener("drop", e => {
    if (!dragId) return;
    e.preventDefault();
    const slot = dropSlot;
    const id = dragId;
    const beforeId = beforeIdOf(slot);
    const skip = !slot || isNoOpDrop(beforeId);
    clearDropSlot();
    dragId = null;
    if (!skip) reorderTo(id, beforeId);
  });
  $("#trklist").addEventListener("dragend", () => {

    addEventListener("resize", tick);
  }
  $("#t-undo").onclick = undo;
  $("#t-redo").onclick = redo;
  $("#qty").onchange = e => {
    state.ui.qty = Math.min(10, Math.max(1, int(e.target.value, 1)));
    save(LS.ui, state.ui);
  };

  // dice
  $("#dcount").innerHTML = Array.from({length: 20}, (_, i) => `<option>${i + 1}</option>`).join("");
  $("#dpick").addEventListener("click", e => {
    const b = e.target.closest("[data-d]"); if (!b) return;
    state.dice.ui.die = +b.dataset.d;
    save(LS.dice, state.dice); renderDice();
  });
  document.querySelectorAll("#dice [data-adv]").forEach(b => b.onclick = () => {
    state.dice.ui.adv = b.dataset.adv;
    save(LS.dice, state.dice); renderDice();
  });
  $("#dcount").onchange = e => {
    state.dice.ui.count = Math.min(20, Math.max(1, int(e.target.value, 1)));
    save(LS.dice, state.dice);
  };
  $("#dmod").onchange = e => {
    state.dice.ui.mod = Math.min(99, Math.max(-99, int(e.target.value, 0)));
    save(LS.dice, state.dice); renderDice();
  };
  $("#d-roll").onclick = () => {
    const u = state.dice.ui;
    doRoll({ d: u.die, n: u.count, mod: u.mod, adv: u.adv });
  };
  $("#dhist").addEventListener("click", e => {
    const re = e.target.closest(".dre");
    if (re){ const h = state.dice.history[+re.dataset.i]; if (h) doRoll(h.spec); return; }
    if (e.target.closest("#d-clear")){
      state.dice.history = [];
      save(LS.dice, state.dice); renderDice();
    }
  });
  $("#dice").addEventListener("toggle", () => {
    state.ui.diceOpen = $("#dice").open;
    save(LS.ui, state.ui);
  });
  $("#pd-showrolls").onchange = e => setPdShowRolls(e.target.checked);
  renderPdRollToggle();

  // clickable dice in stat blocks: one delegated listener on the reading pane;
  // rolls land in the dice history and a small popover shows the breakdown
  let dpopTimer = null;
  function showDpop(anchor, entry){
    const p = $("#dpop");
    p.innerHTML = breakdownHTML(entry);
    p.hidden = false;
    const r = anchor.getBoundingClientRect();
    const x = Math.min(Math.max(8, r.left), innerWidth - p.offsetWidth - 8);
    let y = r.top - p.offsetHeight - 6;
    if (y < 8) y = r.bottom + 6;
    p.style.left = x + "px"; p.style.top = y + "px";
    clearTimeout(dpopTimer);
    dpopTimer = setTimeout(hideDpop, 4000);
  }
  function hideDpop(){
    clearTimeout(dpopTimer);
    $("#dpop").hidden = true;
  }
  $("#pane").addEventListener("click", e => {
    const close = e.target.closest("[data-spk-close]");
    if (close){ closeSpellPeek(); return; }
    const cat = e.target.closest("[data-spk-catalog]");
    if (cat){
      const id = cat.dataset.spkCatalog;
      closeSpellPeek();
      if (window.setSide) setSide("spell");
      pickById(id);
      return;
    }
    const link = e.target.closest(".slink");
    if (link){
      const id = link.dataset.spell;
      if (!id) return;
      const sheet = $("#pane-sheet");
      const h2 = sheet && sheet.querySelector(".sb h2 span");
      openSpellPeek(id, {
        under: link.dataset.under || "",
        returnEl: link,
        backName: h2 ? h2.textContent : "monster",
      });
      return;
    }
    const b = e.target.closest(".droll");
    if (!b) return;
    const m = /^(\d+)d(\d+)([+-]\d+)?$/.exec(b.dataset.roll || "");
    if (!m) return;
    showDpop(b, doRoll({ d: +m[2], n: +m[1], mod: m[3] ? +m[3] : 0, adv: "normal" }));
  });
  document.addEventListener("click", e => {
    if (!$("#dpop").hidden && !e.target.closest("#dpop") && !e.target.closest(".droll"))
      hideDpop();
  });

  return { state, setMode, setSide, onDataReady, renderTrk, renderSideList, key,
           mutate, undo, redo, addMany, addFromView, removeCombatant, applyHP,
           startCombat, endCombat, nextTurn, prevTurn, canPrev,
           setInitiative, reorderTo, moveBy, resetEnc, clearAll,
           initModOf, acOf, hpOf, openAddForm, openStartModal, closeOvl,
           rollDice, doRoll, savePreset, loadPreset, openPartyOvl, openPresetsOvl,
           pdHTML, openPdWindow, pickCombatant,
           _test: { vEnc, vParty, vPresets, vDice, vUi, autoName, hpClass, midInit,
                    badgeOf, scalePd } };
})();
/* const bindings don't become window properties; the start()/keydown hooks in
   the first script test window.TRK so they stay no-ops if this block is absent */
window.TRK = TRK;
</script>
</body>
</html>

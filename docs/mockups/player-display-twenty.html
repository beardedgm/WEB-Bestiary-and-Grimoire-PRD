<!-- Approved comp for the Tracker's player display (2026-09-04): a standalone
     comparison fixture, not app code. The live board is rendered by TRK.pdHTML /
     pdCSS in app.template.html; compare against this at 1920×1080. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Player display comp (twenty combatants) — Bestiary &amp; Grimoire</title>
</head>
<body>
  <style>
    body { margin: 0; background: #E7E5E0; }
    a { color: #7B2418; } a:hover { color: #9C3020; }
    .sc { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-variant: small-caps; font-weight: 600; letter-spacing: 0.08em; }
    .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; font-variant-numeric: tabular-nums; }
    .nm { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dot { width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; flex: none; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 10px; border-radius: 2px; line-height: 1; white-space: nowrap; }
    .row { display: flex; align-items: center; gap: 18px; flex: 1; min-height: 0; padding: 0 26px; border-radius: 3px; background: #FFFFFF; border: 1px solid #DCD9D1; box-sizing: border-box; color: #24211C; }
    .row .init { font-size: 38px; width: 64px; text-align: right; color: #5F594F; }
    .row .nm { font-size: 42px; flex: 1; min-width: 0; }
  </style>
<div style="width: 1920px; height: 1080px; overflow: hidden; background: #E7E5E0; color: #24211C; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 34px 64px 26px; border-bottom: 2px solid #C5C2B8; flex: none;">
    <div class="sc" style="font-size: 40px; color: #24211C;">The Siege of Hollow Gate</div>
    <div style="display: flex; align-items: baseline; gap: 16px;">
      <span class="sc" style="font-size: 30px; color: #5F594F;">Round</span>
      <span class="num" style="font-size: 56px; color: #24211C;">3</span>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; justify-content: center; gap: 40px; padding: 30px 64px 34px;">
    <div style="flex: 1; max-width: 860px; display: flex; flex-direction: column; gap: 8px; min-height: 0;">
<div class="row" style=""><span class="num init" style="color:#5F594F;">24</span><span class="nm" style="">Thessaly</span><div style="display:flex;gap:8px;"><div class="dot" style="background:#3B6EA5;border:1px solid rgba(36,33,28,.25);"></div></div></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">22</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 1</span></div>
<div class="row" style=""><span class="num init" style="color:#5F594F;">21</span><span class="nm" style="">River</span><div style="display:flex;gap:8px;"><div class="dot" style="background:#54632A;border:1px solid rgba(36,33,28,.25);"></div></div></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">19</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 2</span><span class="badge" style="background:#7B2418;color:#FBF6EA;">Bloody</span></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">18</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 3</span></div>
<div class="row" style=""><span class="num init" style="color:#5F594F;">17</span><span class="nm" style="">Marrow</span><div style="display:flex;gap:8px;"><div class="dot" style="background:transparent;border:4px solid #9C3020;"></div></div><span class="badge" style="border:2px solid #9C7C1C;color:#24211C;">Hurt</span></div>
<div class="row" style="background:#24211C;border-color:#24211C;color:#F2F1ED;"><span class="num init" style="color:#F2F1ED;">16</span><span class="nm" style="color:#F2F1ED;">Ember</span><div style="display:flex;gap:8px;"><div class="dot" style="background:#9C3020;border:1px solid rgba(36,33,28,.25);"></div><div class="dot" style="background:transparent;border:4px solid #3B6EA5;"></div></div><span class="badge" style="border:2px solid #9C7C1C;color:#F2F1ED;">Hurt</span></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">15</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 4</span></div>
<div class="row" style="background:#F2F1ED;color:#645D51;"><span class="num init" style="color:#645D51;">14</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 5</span><span class="badge" style="border:2px solid #645D51;color:#24211C;">Unconscious</span></div>
<div class="row" style=""><span class="num init" style="color:#5F594F;">13</span><span class="nm" style="">Azariah</span><div style="display:flex;gap:8px;"><div class="dot" style="background:transparent;border:4px solid #C4A035;"></div></div><span class="badge" style="background:#7B2418;color:#FBF6EA;">Bloody</span></div>
    </div>
    <div style="flex: 1; max-width: 860px; display: flex; flex-direction: column; gap: 8px; min-height: 0;">
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">12</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 6</span></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">11</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 7</span></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">10</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 8</span><span class="badge" style="border:2px solid #9C7C1C;color:#24211C;">Hurt</span></div>
<div class="row" style=""><span class="num init" style="color:#5F594F;">9</span><span class="nm" style="">Wren</span><div style="display:flex;gap:8px;"><div class="dot" style="background:#F2F1ED;border:2px solid #645D51;"></div></div></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">8</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 9</span></div>
<div class="row" style="background:#F2F1ED;color:#645D51;"><span class="num init" style="color:#645D51;">7</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 10</span><span class="badge" style="border:2px solid #645D51;color:#24211C;">Unconscious</span></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">6</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 11</span></div>
<div class="row" style=""><span class="num init" style="color:#5F594F;">5</span><span class="nm" style="">Kestrel</span></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">4</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 12</span><span class="badge" style="background:#7B2418;color:#FBF6EA;">Bloody</span></div>
<div class="row" style="color:#5F594F;"><span class="num init" style="color:#5F594F;">3</span><span class="nm" style="font-style:italic;font-weight:500;">Enemy 13</span></div>
    </div>
  </div>

  <div style="flex: none; display: flex; justify-content: flex-end; align-items: baseline; gap: 18px; padding: 0 64px 24px;">
    <span class="sc" style="font-size: 26px; color: #5F594F;">Roll</span>
    <span class="num" style="font-size: 64px; line-height: 1; color: #24211C;">17</span>
  </div>

</div>
</body>
</html>
